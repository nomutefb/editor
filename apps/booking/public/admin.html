<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예매 관리</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px calc(40px + env(safe-area-inset-bottom));
    background: #f5f6f8; color: #16181d;
    font: 400 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .card { background: #fff; border: 1px solid #e3e5ea; border-radius: 13px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #4b5563; }
  input, textarea {
    width: 100%; padding: 11px 13px; font-size: 15px; font-family: inherit; color: inherit;
    border: 1px solid #c9ccd3; border-radius: 10px; background: #fff; -webkit-appearance: none; appearance: none;
  }
  textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  input:focus, textarea:focus { outline: none; border-color: #2f6df6; }
  button {
    min-height: 46px; padding: 0 18px; border: 0; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 700; color: #fff; background: #2f6df6;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button.ghost { background: #eceef2; color: #374151; }
  button.warn { background: #e14b3d; }
  button:disabled { background: #b8bec9; }
  button.sm { min-height: 34px; padding: 0 11px; font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 5px; border-bottom: 1px solid #eef0f3; text-align: left; white-space: nowrap; }
  th { color: #6b7280; font-size: 12px; font-weight: 700; }
  .stk { display: grid; grid-template-columns: 84px 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
  .stk input { text-align: center; }
  .msg { margin-top: 10px; padding: 10px 12px; border-radius: 9px; font-size: 13.5px; font-weight: 600; white-space: pre-wrap; }
  .msg.err { background: #fdecec; color: #b42318; }
  .msg.ok { background: #eaf3ff; color: #1c4fbb; }
  .hide { display: none; }
  .sum { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .pill { background: #eef1f6; border-radius: 9px; padding: 8px 11px; font-size: 13px; font-weight: 700; }
  .muted { color: #8b919c; font-size: 12.5px; line-height: 1.6; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>예매 관리</h1>

  <section id="lock">
    <div class="card">
      <label for="pin">관리자 비번</label>
      <div class="row">
        <input id="pin" type="password" autocomplete="current-password" style="flex:1;min-width:160px">
        <button id="login" type="button">들어가기</button>
      </div>
      <div id="mL" class="msg err hide"></div>
    </div>
  </section>

  <section id="panel" class="hide">
    <div class="card">
      <h2>현황</h2>
      <div class="sum" id="sum"></div>
      <div class="row">
        <button id="reload" class="ghost" type="button">새로고침</button>
        <button id="csv" class="ghost" type="button">표 복사(엑셀 붙여넣기)</button>
      </div>
      <div class="scroll" style="margin-top:12px">
        <table>
          <thead><tr><th>시각</th><th>예매자</th><th>뒷4자리</th><th>구분</th><th>객실</th><th>취소</th></tr></thead>
          <tbody id="rows"><tr><td colspan="6" class="muted">불러오는 중...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>명단 등록</h2>
      <p class="muted" style="margin:0 0 10px">한 줄에 한 명씩 <b>뒷4자리, 구분(a·b·c), 이름</b> 순서로. 이름은 없어도 돼.<br>엑셀에서 세 칸을 그대로 복사해 붙여넣어도 된다. <b>저장하면 기존 명단은 통째로 교체</b>돼.</p>
      <textarea id="ros" placeholder="1234, a, 홍길동&#10;5678, b, 김철수&#10;9012, c"></textarea>
      <div class="row" style="margin-top:10px">
        <button id="saveRos" type="button">명단 저장</button>
      </div>
      <div id="mR" class="msg hide"></div>
    </div>

    <div class="card">
      <h2>객실 수량</h2>
      <div class="stk"><span class="muted">구분</span><span class="muted" style="text-align:center">스탠다드 더블</span><span class="muted" style="text-align:center">스탠다드 트윈</span></div>
      <div id="stk"></div>
      <div class="row" style="margin-top:6px">
        <button id="saveStk" type="button">수량 저장</button>
      </div>
      <p class="muted" style="margin:10px 0 0">이미 선택된 건수보다 적게 줄이면 남은 수량은 0으로 표시돼(기존 선택은 안 지워진다).</p>
      <div id="mS" class="msg hide"></div>
    </div>
  </section>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var PIN = '';
  var GROUPS = ['a', 'b', 'c'];
  var TN = { double: '스탠다드 더블', twin: '스탠다드 트윈' };
  var lastRows = [];

  function say(el, text, kind) {
    el.textContent = text || '';
    el.className = 'msg ' + (kind || 'err') + (text ? '' : ' hide');
  }
  function api(body) {
    body.pin = PIN;
    return fetch('/api/book', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
    }).then(function (r) { return r.json(); })
      .catch(function () { return { ok: false, msg: '연결 실패' }; });
  }
  function fmt(ms) {
    var d = new Date(ms), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  $('login').addEventListener('click', function () {
    PIN = $('pin').value;
    if (!PIN) { say($('mL'), '비번을 입력해줘.'); return; }
    api({ op: 'admin_get' }).then(function (r) {
      if (!r.ok) { say($('mL'), r.msg || '들어가지 못했어.'); return; }
      try { sessionStorage.setItem('bkpin', PIN); } catch (e) {}
      $('lock').classList.add('hide'); $('panel').classList.remove('hide');
      paint(r);
    });
  });
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('login').click(); });

  function paint(r) {
    var caps = r.cap || {}, labels = r.labels || {}, left = r.left || {};
    var keys = Object.keys(caps); if (!keys.length) keys = GROUPS;

    var sum = '';
    keys.forEach(function (g) {
      var c = caps[g] || {}, l = left[g] || {};
      sum += '<span class="pill">' + (labels[g] || g.toUpperCase()) +
        ' · 더블 ' + (l.double != null ? l.double : '-') + '/' + (c.double || 0) +
        ' · 트윈 ' + (l.twin != null ? l.twin : '-') + '/' + (c.twin || 0) + '</span>';
    });
    sum += '<span class="pill">명단 ' + (r.rosterCount || 0) + '명 · 선택 완료 ' + (r.rows || []).length + '건</span>';
    $('sum').innerHTML = sum;

    var stk = '';
    keys.forEach(function (g) {
      var c = caps[g] || {};
      stk += '<div class="stk">' +
        '<input data-lb="' + g + '" value="' + (labels[g] || g.toUpperCase()) + '" maxlength="20">' +
        '<input data-cap="' + g + '" data-t="double" type="number" min="0" inputmode="numeric" value="' + (c.double || 0) + '">' +
        '<input data-cap="' + g + '" data-t="twin" type="number" min="0" inputmode="numeric" value="' + (c.twin || 0) + '"></div>';
    });
    $('stk').innerHTML = stk;

    lastRows = r.rows || [];
    if (!lastRows.length) { $('rows').innerHTML = '<tr><td colspan="6" class="muted">아직 선택한 사람이 없어.</td></tr>'; return; }
    var html = '';
    lastRows.forEach(function (b) {
      html += '<tr><td>' + fmt(b.at) + '</td><td>' + (b.name || '-') + '</td><td>' + b.p4 + '</td><td>' +
        (labels[b.group] || b.group.toUpperCase()) + '</td><td>' + (b.type === 'double' ? '더블' : '트윈') +
        '</td><td><button class="ghost sm" data-cx="' + b.p4 + '" type="button" title="선택 취소">✕</button></td></tr>';
    });
    $('rows').innerHTML = html;
  }

  function reload() {
    api({ op: 'admin_get' }).then(function (r) { if (r.ok) paint(r); });
  }
  $('reload').addEventListener('click', reload);

  $('rows').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cx]'); if (!b) return;
    var p4 = b.getAttribute('data-cx');
    if (!window.confirm('뒷4자리 ' + p4 + ' 선택을 취소할게. 그 자리는 다시 열려.')) return;
    b.disabled = true;
    api({ op: 'admin_cancel', p4: p4 }).then(function (r) { if (r.ok) reload(); else b.disabled = false; });
  });

  $('csv').addEventListener('click', function () {
    var t = '선택 시각\t예매자\t뒷4자리\t구분\t객실\n';
    lastRows.forEach(function (b) {
      t += new Date(b.at).toLocaleString('ko-KR') + '\t' + (b.name || '') + '\t' + b.p4 + '\t' +
        b.group.toUpperCase() + '\t' + (b.typeName || TN[b.type] || b.type) + '\n';
    });
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); alert('복사했어. 엑셀에 붙여넣어줘.'); }
    catch (e) { alert('복사가 막혔어. 표를 직접 긁어서 복사해줘.'); }
    document.body.removeChild(ta);
  });

  $('saveRos').addEventListener('click', function () {
    var txt = $('ros').value.trim();
    if (!txt) { say($('mR'), '명단이 비어 있어.'); return; }
    if (!window.confirm('기존 명단을 이 내용으로 통째로 바꿀게. 진행할까?')) return;
    say($('mR'), '저장 중...', 'ok');
    api({ op: 'admin_roster', text: txt }).then(function (r) {
      if (!r.ok) { say($('mR'), r.msg || '저장 실패'); return; }
      var m = r.count + '명 저장했어.';
      if (r.dups && r.dups.length) m += '\n⚠ 뒷4자리가 겹쳐서 뒤엣것을 버렸어: ' + r.dups.join(', ');
      if (r.bad && r.bad.length) m += '\n⚠ 형식이 안 맞아 건너뛴 줄 ' + r.bad.length + '개: ' + r.bad.slice(0, 3).join(' / ');
      say($('mR'), m, (r.dups && r.dups.length) || (r.bad && r.bad.length) ? 'err' : 'ok');
      reload();
    });
  });

  $('saveStk').addEventListener('click', function () {
    var cap = {}, labels = {};
    Array.prototype.forEach.call(document.querySelectorAll('[data-cap]'), function (i) {
      var g = i.getAttribute('data-cap');
      cap[g] = cap[g] || {};
      cap[g][i.getAttribute('data-t')] = Math.max(0, parseInt(i.value, 10) || 0);
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lb]'), function (i) {
      labels[i.getAttribute('data-lb')] = i.value.trim();
    });
    say($('mS'), '저장 중...', 'ok');
    api({ op: 'admin_stock', cap: cap, labels: labels }).then(function (r) {
      if (!r.ok) { say($('mS'), r.msg || '저장 실패'); return; }
      say($('mS'), '수량을 저장했어.', 'ok');
      reload();
    });
  });

  try {
    var saved = sessionStorage.getItem('bkpin');
    if (saved) { $('pin').value = saved; $('login').click(); }
  } catch (e) {}
})();
</script>
</body>
</html>
