<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>객실 선택</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 22px 18px calc(34px + env(safe-area-inset-bottom));
    background: #f5f6f8; color: #16181d;
    font: 400 16px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .sub { margin: 0 0 22px; color: #6b7280; font-size: 14px; }
  .card { background: #fff; border: 1px solid #e3e5ea; border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  input[type=tel] {
    width: 100%; height: 56px; padding: 0 16px; font-size: 22px; font-weight: 600;
    letter-spacing: 6px; text-align: center;
    border: 1px solid #c9ccd3; border-radius: 12px; background: #fff; color: inherit;
    font-family: inherit; -webkit-appearance: none; appearance: none;
  }
  input[type=tel]:focus { outline: none; border-color: #2f6df6; box-shadow: 0 0 0 3px rgba(47,109,246,.16); }
  button {
    width: 100%; min-height: 54px; border: 0; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 700; color: #fff; background: #2f6df6;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button:disabled { background: #b8bec9; cursor: default; }
  button:active:not(:disabled) { filter: brightness(.93); }
  .seat {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; min-height: 76px; padding: 16px; margin-bottom: 10px; text-align: left;
    background: #fff; color: #16181d; border: 1.5px solid #d7dae1; border-radius: 13px; font-weight: 600;
  }
  .seat:disabled { background: #f1f2f4; color: #a2a8b3; border-color: #e3e5ea; }
  .seat .nm { font-size: 17px; }
  .seat .left { font-size: 14px; font-weight: 700; color: #2f6df6; white-space: nowrap; }
  .seat:disabled .left { color: #a2a8b3; }
  .msg { margin-top: 12px; padding: 12px 14px; border-radius: 11px; font-size: 14px; font-weight: 600; }
  .msg.err { background: #fdecec; color: #b42318; }
  .msg.ok { background: #eaf3ff; color: #1c4fbb; }
  .hide { display: none; }
  .done-mark { font-size: 40px; line-height: 1; margin-bottom: 10px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid #eef0f3; font-size: 15px; }
  .kv:last-child { border-bottom: 0; }
  .kv .k { color: #6b7280; }
  .kv .v { font-weight: 700; }
  .note { margin-top: 16px; color: #8b919c; font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 1단계: 인증 -->
  <section id="step1">
    <h1>객실 선택</h1>
    <p class="sub">예매하신 휴대폰 번호 뒷 4자리를 입력해주세요.</p>
    <div class="card">
      <label for="p4">휴대폰 뒷 4자리</label>
      <input id="p4" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4"
             autocomplete="off" placeholder="0000" enterkeyhint="go">
      <div style="height:14px"></div>
      <button id="go" type="button">확인</button>
      <div id="m1" class="msg err hide"></div>
    </div>
    <p class="note">예매하신 분 명단으로 확인합니다.<br>번호가 확인되면 객실을 고르실 수 있어요.</p>
  </section>

  <!-- 2단계: 좌석 선택 -->
  <section id="step2" class="hide">
    <h1 id="hi">객실을 골라주세요</h1>
    <p class="sub" id="sub2">남은 객실만 선택할 수 있어요. 한 번 고르면 바꿀 수 없습니다.</p>
    <div class="card">
      <button class="seat" type="button" data-t="double">
        <span class="nm">스탠다드 더블</span><span class="left" data-l="double">-</span>
      </button>
      <button class="seat" type="button" data-t="twin">
        <span class="nm">스탠다드 트윈</span><span class="left" data-l="twin">-</span>
      </button>
      <div id="m2" class="msg err hide"></div>
    </div>
    <p class="note">더블 = 큰 침대 1개 · 트윈 = 침대 2개</p>
  </section>

  <!-- 3단계: 완료 -->
  <section id="step3" class="hide">
    <div class="card" style="text-align:center">
      <div class="done-mark">✅</div>
      <h1 style="margin-bottom:4px">선택 완료</h1>
      <p class="sub" style="margin-bottom:18px" id="doneSub">아래 내용으로 접수됐어요.</p>
      <div style="text-align:left">
        <div class="kv"><span class="k">예매자</span><span class="v" id="dName">-</span></div>
        <div class="kv"><span class="k">객실</span><span class="v" id="dType">-</span></div>
        <div class="kv"><span class="k">선택 시각</span><span class="v" id="dAt">-</span></div>
      </div>
    </div>
    <p class="note">변경이 필요하시면 담당자에게 연락해주세요.</p>
  </section>

</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var p4El = $('p4'), goEl = $('go');
  var state = { p4: '', busy: false };

  function show(n) {
    $('step1').classList.toggle('hide', n !== 1);
    $('step2').classList.toggle('hide', n !== 2);
    $('step3').classList.toggle('hide', n !== 3);
    window.scrollTo(0, 0);
  }
  function say(el, text, kind) {
    el.textContent = text || '';
    el.className = 'msg ' + (kind || 'err') + (text ? '' : ' hide');
  }
  function api(body) {
    return fetch('/api/book', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    }).then(function (r) { return r.json(); }).catch(function () {
      return { ok: false, msg: '연결이 불안정해요. 잠시 뒤 다시 눌러주세요.' };
    });
  }
  function fmt(ms) {
    var d = new Date(ms);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function done(bk, label) {
    $('dName').textContent = bk.name || ('*' + state.p4);
    $('dType').textContent = (label ? label + ' · ' : '') + (bk.typeName || bk.type);
    $('dAt').textContent = fmt(bk.at);
    show(3);
  }
  function paintLeft(left) {
    var any = false;
    Array.prototype.forEach.call(document.querySelectorAll('.seat'), function (b) {
      var t = b.dataset.t, n = Number((left || {})[t] || 0);
      b.querySelector('[data-l="' + t + '"]').textContent = n > 0 ? ('남은 수량 ' + n) : '마감';
      b.disabled = n <= 0;
      if (n > 0) any = true;
    });
    if (!any) say($('m2'), '남은 객실이 없어요. 담당자에게 연락해주세요.', 'err');
  }

  p4El.addEventListener('input', function () {
    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);
    say($('m1'), '');
  });
  p4El.addEventListener('keydown', function (e) { if (e.key === 'Enter') goEl.click(); });

  goEl.addEventListener('click', function () {
    if (state.busy) return;
    var v = p4El.value.replace(/[^0-9]/g, '');
    if (v.length !== 4) { say($('m1'), '숫자 4자리를 입력해주세요.'); p4El.focus(); return; }
    state.busy = true; goEl.disabled = true; goEl.textContent = '확인 중...';
    api({ op: 'auth', p4: v }).then(function (r) {
      state.busy = false; goEl.disabled = false; goEl.textContent = '확인';
      if (!r.ok) { say($('m1'), r.msg || '확인하지 못했어요.'); return; }
      state.p4 = v;
      if (r.done) { done(r.booking, r.label); return; }
      $('hi').textContent = (r.name ? r.name + '님, ' : '') + '객실을 골라주세요';
      if (r.label) $('sub2').textContent = r.label + ' · 남은 객실만 선택할 수 있어요. 한 번 고르면 바꿀 수 없습니다.';
      paintLeft(r.left);
      say($('m2'), '');
      show(2);
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.seat'), function (b) {
    b.addEventListener('click', function () {
      if (state.busy || b.disabled) return;
      var t = b.dataset.t;
      var nm = b.querySelector('.nm').textContent;
      if (!window.confirm(nm + '(으)로 선택할게요.\n한 번 고르면 바꿀 수 없어요.')) return;
      state.busy = true;
      Array.prototype.forEach.call(document.querySelectorAll('.seat'), function (x) { x.disabled = true; });
      say($('m2'), '접수 중이에요...', 'ok');
      api({ op: 'book', p4: state.p4, type: t }).then(function (r) {
        state.busy = false;
        if (r.ok) { done(r.booking, r.label); return; }
        if (r.code === 'already') { done(r.booking, r.label); return; }
        say($('m2'), r.msg || '접수하지 못했어요. 다시 눌러주세요.', 'err');
        if (r.left) paintLeft(r.left);
        else Array.prototype.forEach.call(document.querySelectorAll('.seat'), function (x) { x.disabled = false; });
      });
    });
  });

  p4El.focus();
})();
</script>
</body>
</html>
