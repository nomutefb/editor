  .go { width:100%; margin-top:2px; padding:var(--sp-1); background:rgba(255,255,255,.02); color:var(--accent); border:1px solid var(--line); border-radius:var(--r-m); font-weight:800; font-size:var(--fs-label); font-family:inherit; line-height:1; cursor:pointer; position:relative; overflow:hidden; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; transition:transform var(--dur-fast) ease, background var(--dur) ease, border-color var(--dur) ease; }  .go:disabled { opacity:.5; cursor:default; transform:none; }

  /* ── Image Studio(#genidlg) 폼 문법 이식 — 운영자 260714 4차 "이미지 제작부분 그대로 가져와 항목만 교체 · 만드는 화면 전부 이 기틀 계승". 값 = viewer/index.html #genidlg 블록 동일값 복제(재설계 0) · 공용 수정은 index와 양쪽 동시 ── */

  .geni-row { display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-2); padding:8px 0; }   /* raw-ok: index .geni-row 동일값 계승(padding 8 — 라벨 좌·값 우 baseline) */

<script src="nm-loader.js"></script><!-- 로더 팩토리 SSOT(yeulmaru-promo mkLoader 이식) — .nmld 도트 · 강조색 --accent -->
<script src="draft.js"></script><!-- 입력 드래프트 30분 만료 SSOT(운영자 260801) -->
<script>
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
// 이야기 구성 칸 = [복사][붙여넣기][지우개] 3버튼 분리 — k.html(#scene attachCopyPaste식) 바이트 계승(운영자 260714 "입력창엔 항상 3버튼")
[['#scene', '#sceneClip'], ['#sumTx', '#sumClip']].forEach(function ([taSel, bSel]) {   // 요약 칸도 같은 3버튼(클립 커버리지 계약 = 모든 텍스트 입력칸에 붙는다)
  const ta = $(taSel), b = $(bSel); if (!ta || !b) return;
  b.classList.add('scn-pp');   // 붙여넣기 = 지우개 좌측(46)·항상 붙여넣기
  const cp = document.createElement('button'); cp.type = 'button'; cp.className = 'scnclip scn-copy scn-hide';
  cp.setAttribute('aria-label', '복사'); cp.title = '복사'; b.parentNode.appendChild(cp);
  const er = document.createElement('button'); er.type = 'button'; er.className = 'scnclip scn-erase'; er.setAttribute('aria-label', '입력 지우기'); er.title = '입력 지우기';
  b.parentNode.appendChild(er);
  let undoTimer = null, undoVal = '', prog = false;
  const setIcon = (el, svg, key) => { if (el._icon !== key) { el.innerHTML = svg; el._icon = key; } };   // 재대입 억제 = 타이핑 번쩍 차단(k 계승)
  const upd = () => {
    const f = (ta.value || '').trim().length > 0;
    if (!b.classList.contains('ok')) { setIcon(b, PASTE_SVG, 'paste'); b.setAttribute('aria-label', '붙여넣기'); b.title = '붙여넣기'; }
    if (!cp.classList.contains('ok')) { setIcon(cp, COPY_SVG, 'copy'); cp.classList.toggle('scn-hide', !f); }
    if (!er.classList.contains('scn-undo')) { setIcon(er, ERASE_SVG, 'erase'); er.classList.toggle('scn-off', !f); }
  };
  const exitUndo = () => { if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; } er.classList.remove('scn-undo'); er.innerHTML = ERASE_SVG; er.setAttribute('aria-label', '입력 지우기'); er.title = '입력 지우기'; upd(); };
  er.addEventListener('click', e => { e.preventDefault();
    if (er.classList.contains('scn-undo')) { prog = true; ta.value = undoVal; ta.dispatchEvent(new Event('input', { bubbles: true })); prog = false; try { ta.focus(); } catch {} exitUndo(); return; }
    if (!(ta.value || '').length) return;
    undoVal = ta.value; prog = true; ta.value = ''; ta.dispatchEvent(new Event('input', { bubbles: true })); prog = false; try { ta.focus(); } catch {}
    er.classList.remove('scn-off'); er.classList.add('scn-undo'); er.innerHTML = UNDO_SVG; er.setAttribute('aria-label', '되돌리기'); er.title = '되돌리기 (직전 입력 복원)';
    if (undoTimer) clearTimeout(undoTimer); undoTimer = setTimeout(exitUndo, 10000);
  });
  cp.addEventListener('click', async e => { e.preventDefault();
    try { await navigator.clipboard.writeText(ta.value); cp.innerHTML = CHECK_SVG; cp._icon = 'check'; cp.classList.add('ok'); setTimeout(() => { cp.classList.remove('ok'); upd(); }, 1200); } catch {}
  });
  b.addEventListener('click', async e => { e.preventDefault();
    const selS = ta.selectionStart, selE = ta.selectionEnd;
    try { const t = await navigator.clipboard.readText(); if (t) { if (typeof ta.setRangeText === 'function' && typeof selS === 'number') ta.setRangeText(t, selS, selE, 'end'); else ta.value += t; ta.dispatchEvent(new Event('input', { bubbles: true })); } } catch {} upd();   // 캐럿 삽입(k 계승·운영자 260702)
  });
  // 입력 드래프트 영속(k 계승 — 도구모달 닫기 = iframe 리로드 대비 localStorage 미러)
  const DKEY = 'sb_scene_draft'; let saveT = null;
  const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { nmDraftSave(DKEY, ta.value); }, 400); };
  const flush = () => { clearTimeout(saveT); nmDraftSave(DKEY, ta.value); };
  addEventListener('pagehide', flush); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
  const d = nmDraftLoad(DKEY); if (d && !ta.value.trim()) ta.value = d;   // 30분 만료(draft.js SSOT · 운영자 260801 "전역" · k 계승)
  // 자동 증장(적대검증 260730 유효 지적): 높이 2/3(64px = 2행)로 줄인 대가로 8000자 입력이 2행에 갇히는 회귀 → 입력량만큼 상한까지 늘린다(상한 = 5행 ≈ 160px · 넘으면 내부 스크롤). resize 핸들 없음·sticky 도크 안이라 자동 증장이 유일한 출구.
  const GROW_MAX = 160;   /* raw-ok: 64px(2행 = Q1159 지정값) × 2.5 = 5행 상한 — 도크가 화면을 잠식하지 않는 실측 한계 */
  const grow = () => { ta.style.height = 'auto'; const h = Math.min(ta.scrollHeight, GROW_MAX); ta.style.height = Math.max(64, h) + 'px'; ta.style.overflowY = (ta.scrollHeight > GROW_MAX) ? 'auto' : 'hidden'; };
  ta.addEventListener('input', () => { if (!prog && undoTimer) exitUndo(); save(); upd(); grow(); sbFireGate(); }); upd(); grow();
});

// ── 발사 게이트 = 둘 중 하나는 반드시 있어야 한다(운영자 260812 「둘 중에 하나는 무조건 넣어줘야 됨,
//    뭘 만들지를 모르니까 · 안 그러면 생성 안 되게(입력 필요)」).
//    ⚠ 요약만 있어도 되고 코멘트만 있어도 된다 — 둘 다 비었을 때만 막는다.
function sbFireGate() {
  const go = document.getElementById('go'); if (!go) return;
  const sum = (document.getElementById('sumTx') || {}).value || '';
  const sc = (document.getElementById('scene') || {}).value || '';
  const ok = !!(sum.trim() || sc.trim());
  go.disabled = !ok;
  go.title = ok ? '' : '요약이나 내용 중 하나는 넣어야 한다 — 뭘 만들지 모른다';
}

// ── 📰 기사 고르기 = 뉴스 요약에 오른 기사 목록에서 **자유요약**을 끌어온다(운영자 260814).
//    창 = 설정 대기열 창 그대로(부품·값 사본 · 위 CSS 주석) · 행 = [번호 · 제목 · 이동].
//    ⚠ 무엇을 가져오나 = 상세 본문 「## 📦 콘텐츠 초안」 안의 `### [자유요약 …]` 절이다.
//      구판은 맨 위 「## 🧷 한줄 요약」 한 문장을 가져왔다 — 운영자가 말한 그 밀집된 소스
//      (자유요약·IG·Thread) 중 하나가 아니라 **아예 다른 절**이었다(260814 실측 정정).
//    ⚠ 절 이름은 분석 지침 정본(prompts/news-analysis.md 98행 `### [자유요약 — 약 N자]`) 그대로.
const SB_FREE_RE = /^###\s*\[\s*자유요약[^\]]*\]\s*$([\s\S]*?)(?=^###\s|^##\s|\Z)/m;   // 자유요약 절 본문
(function () {
  const btn = document.getElementById('sumPull'), ta = document.getElementById('sumTx');
  const pop = document.getElementById('artPop'), dim = document.getElementById('artDim');
  const listEl = document.getElementById('artList'), pageEl = document.getElementById('artPage');
  if (!btn || !ta || !pop || !listEl) return;
  const PER = 5;   // 5행 = 대기열 창 높이 계약(.qlist flex-basis = 5 * 47px) — 페이지당 행수를 바꾸면 창 높이가 갈린다
  let items = null, page = 0, busy = false;

  const esc2 = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const GO_SVG = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>';   // ↗ = 대기열 이동 버튼 글리프

  function draw() {
    if (!items) return;
    if (!items.length) { listEl.innerHTML = '<div class="qempty">뉴스 요약에 오른 기사가 없다</div>'; pageEl.innerHTML = ''; return; }
    const pages = Math.ceil(items.length / PER);
    page = Math.min(Math.max(0, page), pages - 1);
    listEl.innerHTML = items.slice(page * PER, page * PER + PER).map(a =>
      '<div class="qrow artrow" data-f="' + esc2(a.file) + '" title="탭 = 이 기사의 자유요약을 자료 참조로 가져온다">'
      + '<span class="qt">' + a._no + '</span>'
      + '<span class="qmain">' + esc2(a.title || a.file) + '</span>'
      + '<span class="qact"><button type="button" class="qgo" data-go="' + esc2(a.file) + '" aria-label="이 요약본 열기" title="이 요약본 열기">' + GO_SVG + '</button></span>'
      + '</div>').join('');
    pageEl.innerHTML = (pages > 1)

// 최소 마크다운 렌더 — k.html renderMd 바이트 계승(펜스 코드블록·헤딩·표/굵게 누출 폴백)
function renderMd(md) {
  const parts = md.split('```');
  const unbal = parts.length % 2 === 0;   // 펜스 홀수 = 마지막 세그먼트 텍스트 강등(k 계승)
  let html = '';
  parts.forEach((part, i) => {
    if (i % 2 === 1 && !(unbal && i === parts.length - 1)) {                    // 코드블록
      let code = part;
      const nl = code.indexOf('\n');
      const first = nl >= 0 ? code.slice(0, nl).trim() : '';
      if (nl >= 0 && (first === '' || (first.length <= 24 && /^[a-zA-Z][a-zA-Z0-9 .:+_-]*$/.test(first)))) code = code.slice(nl + 1);   // 인포스트링 줄 제거(k 계승)
      code = code.replace(/\s+$/, '');
      const enc = encodeURIComponent(code);
      html += `<div class="code"><button data-c="${enc}" aria-label="복사" title="복사">${COPY_SVG}</button><pre>${esc(code)}</pre></div>`;
    } else {
      part.split('\n').forEach(line => {
        const t = line.trim();
        if (!t) return;
        if (t.startsWith('### ')) html += `<h3>${esc(t.slice(4))}</h3>`;
        else if (t.startsWith('## ')) html += `<h2>${esc(t.slice(3))}</h2>`;
        else if (t.startsWith('# ')) html += `<h1 class="t">${esc(t.slice(2))}</h1>`;
        else if (t.startsWith('@ 순서')) html += `<p class="legend">${esc(t)}</p>`;   // 범례 계약(k 계승 — sb 산출엔 통상 미등장·무해)
        else {
          let txt = t;   // 금지 문법 누출 폴백(k 계승 — 표·굵게 강등)
          if (/^\|.*\|$/.test(txt)) txt = txt.replace(/^\||\|$/g, '').split('|').map(s => s.trim()).filter(Boolean).join(' · ');
          txt = txt.replace(/\*\*([^*]+)\*\*/g, '$1');
          html += `<p>${esc(txt)}</p>`;
        }
      });
    }
  });
  return html;
}

// 복사 표식 영속 — k.html CKEY 기틀 계승(키 = 블록 원문 해시·새 생성 시 리셋)
const CKEY = 'sb_copied';
const ckHash = s => { let x = 5381; for (let i = 0; i < s.length; i++) x = (x * 33 ^ s.charCodeAt(i)) >>> 0; return x.toString(36); };
const ckLoad = () => { try { return new Set(JSON.parse(localStorage.getItem(CKEY) || '[]')); } catch (e) { return new Set(); } };
const ckAdd = k => { try { const s = ckLoad(); s.add(k); localStorage.setItem(CKEY, JSON.stringify([...s])); } catch (e) {} };
function wireCopy() {
  const seen = ckLoad();
  document.querySelectorAll('.code button').forEach(b => {
    const txt = decodeURIComponent(b.dataset.c), key = ckHash(txt);
    if (seen.has(key)) b.classList.add('copied');
    b.onclick = () => {
      const ok = () => { b.innerHTML = CHECK_SVG; b.classList.add('done', 'copied'); ckAdd(key);
        setTimeout(() => { b.innerHTML = COPY_SVG; b.classList.remove('done'); }, 1500); };
      navigator.clipboard.writeText(txt).then(ok).catch(() => {   // 폴백도 실패 = 무표식(거짓 체크 금지 · k 계승)
        try { const t = document.createElement('textarea'); t.value = txt; t.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(t); t.focus(); t.select();
          const done = document.execCommand('copy'); t.remove(); if (done) ok(); } catch (e) {}
      });
    };
  });
}

/* 완료 착지 = 결과 레일(포커스·강등 **한 벌** · 운영자 260810 "방금거가 유실된다").
   ⚠ 사본을 두 벌 두면 갈린다 — 실제로 갈려 있었다: 포커스 자리엔 `out`의 `img`만 보는 인라인 사본이 있었고(모션그래픽 video 산출은 통째로 누락),
   강등 자리엔 아무것도 없었다(뒤에서 끝난 콘티가 이력에 영영 미착지). 여기 하나로 회수한다.
   ⚠ 주소는 반드시 절대화한다 — nm-rail 적재는 스킴 화이트리스트(http/https/blob/data)라 `sb_out/…` 상대경로는 **조용히 거절**된다. */
async function sbLand(outEl, outPath) {
  if (!window.nmRail) return;
  const abs = u => { try { return new URL(u, location.href).href; } catch (e) { return String(u || ''); } };
  try {
    if (outEl && outEl.querySelector) {   // 화면에 이미 그려진 산출(모션그래픽 우선 → 레퍼런스 이미지) = 추가 요청 0
      const el = outEl.querySelector('video[src]') || outEl.querySelector('img[src]');
      if (el && el.src) { nmRail.add({ url: abs(el.src), cap: '콘티', dlname: /\.mp4(\?|#|$)/i.test(el.src) ? 'motion.mp4' : 'storyboard.jpg' }); return; }
    }
    if (!outPath) return;

function shootBar(outEl, outPath) {

  const cap = document.createElement('div'); cap.className = 'cap';
  const row = document.createElement('div'); row.className = 'geni-opts'; row.setAttribute('role', 'group');
  row.setAttribute('aria-label', '이 콘티로 제작할 촬영 엔진');

  const used = shotTry()[outPath] || 0;
  const draw = () => {
    row.innerHTML = '';
    SB_SHOOTS.filter(m => m.id !== 'motion').forEach(m => {
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'geni-opt' + (pick === m.id ? ' on' : '');

      b.setAttribute('aria-pressed', String(pick === m.id));
      b.addEventListener('click', () => { pick = m.id; draw(); });
      row.appendChild(b);
    });
    const go = document.createElement('button');
    go.type = 'button'; go.className = 'go'; go.id = 'sbShootGo';
    go.textContent = used >= 2 ? '재생성 소진' : (used === 1 ? '재생성(마지막)' : '제작');
    go.disabled = used >= 2;

    cap.textContent = used >= 2 ? '이 콘티는 재생성을 다 썼다 — 새 콘티로 다시 시작해라'

  draw();
  wrap.appendChild(row); wrap.appendChild(cap);
  outEl.appendChild(wrap);
