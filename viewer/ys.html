<style>

/* ── morphicons(MIT · viewer/vendor/morphicons) = 아이콘 모핑(운영자 260928) ──

function ytCheck(raw) {
  const s = String(raw || '').trim();
  if (!s) return { ok: false, msg: '유튜브 주소를 붙여넣어줘.' };
  let u; try { u = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s); } catch (e) { u = null; }
  const BAD = '유튜브 영상 주소가 아니야 — youtube.com/watch · youtu.be · youtube.com/shorts 주소만 돼.';
  if (!u || !/^https?:$/.test(u.protocol)) return { ok: false, msg: BAD };
  const h = u.hostname.toLowerCase().replace(/^www\./, '');
  let id = '';
  if (h === 'youtu.be') id = decodeURIComponent(u.pathname.split('/')[1] || '');
  else if (h === 'youtube.com' || h === 'm.youtube.com') {
    const sh = u.pathname.match(/^\/shorts\/([^/]+)/);
    if (u.pathname === '/watch') id = u.searchParams.get('v') || '';
    else if (sh) id = decodeURIComponent(sh[1]);
    else return { ok: false, msg: '영상 하나의 주소가 필요해 — 채널·재생목록 주소는 안 돼.' };
  } else return { ok: false, msg: BAD };
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return { ok: false, msg: '영상 ID가 빠졌거나 잘렸어 — 주소를 다시 복사해 붙여넣어줘.' };
  return { ok: true, id: id, url: u.href };
}

/* ── 맥 표시등 = /ys_out/_mac/heartbeat.json(R2 실시간 · 맥 워커 1분 갱신) 30초 폴 · 가려지면 멈춘다(유휴 정숙) ──
   켜짐 = ts 180초 이내 ∧ codex=='chatgpt' · 로그인 필요 = 180초 이내 ∧ 그 외 · 꺼짐 = 없음·만료 */
const MAC = { st: 'wait', busy: false };
async function macPoll() {
  const h = await getJSON('ys_out/_mac/heartbeat.json');

}
function paintImgNote() {   // 장면 그림을 골랐는데 맥이 못 그리는 상태 = 막지 않고 한 줄만 알린다(운영자 260928)

  if ((opts.img === 'codex' || opts.img === 'depth') && macDown) setMsg('#optMsg', MAC.st === 'off' ? '맥이 꺼져 있어서 모션 그래픽으로 만들어져.' : '맥 Codex 로그인이 필요해서 지금은 모션 그래픽으로 만들어져.', 'warn');
  else if (opts.img === 'grok' && macDown) setMsg('#optMsg', '맥이 꺼져 있어서 첫 장면 그림 없이 그록이 바로 영상을 만들어(장면마다 화풍이 조금 흔들릴 수 있어).', 'warn');
  else setMsg('#optMsg', '');
}
let _macT = null;
function macArm() {

/* ══ 작업 저장소 = localStorage `ys_jobs`(탭 자체 배열 · nm-rail data-jobkey가 진행 중 행으로 읽는다) ══
   변경 = 매번 저장소를 새로 읽어 그 위에 적용(다른 탭의 추가를 낡은 목록으로 덮지 않는다) · 저장 실패 = 메모리로 진행하되 성공으로 말하지 않는다. */
const JKEY = 'ys_jobs';
let JOBS = [];
function readJobs() {
  try { const a = JSON.parse(localStorage.getItem(JKEY) || '[]'); return Array.isArray(a) ? a.filter(j => j && j.id).map(j => { if (!j.lbl && j.label) j.lbl = String(j.label); if (!j.out) j.out = 'ys_out/' + j.id + '/result.json'; return j; }) : []; }   // 다른 기기 합류분(nm-jobs 배열 문법 = label·ts) → 이 탭 모양(lbl·t0Of)
  catch (e) { return JOBS.slice(); }
}
let STORE_OK = true;
function mutate(fn) {
  const a = readJobs(); fn(a); JOBS = a.slice(0, 30);
  try { localStorage.setItem(JKEY, JSON.stringify(JOBS)); STORE_OK = true; } catch (e) { STORE_OK = false; }
  try { if (window.nmRail && typeof nmRail.refresh === 'function') nmRail.refresh(); } catch (e) {}
  return STORE_OK;
}
JOBS = readJobs();
const HJOBS = {};   // 완성작(R2 _hist.json) 열람용 가짜 작업 = 로컬 목록에 없는 기기 밖 제작분
const jobOf = id => JOBS.find(j => j.id === id) || HJOBS[id] || null;
const t0Of = j => +j.t0 || +j.ts || Date.now();
function resumeRuns() { JOBS.filter(j => j.status === 'run').forEach(j => { try { if (!(window.nmJobs && nmJobs.busy(JKEY, j.id))) poll(j.id); } catch (e) { poll(j.id); } }); }   // hold 가 중복 폴을 막는다
window.addEventListener('storage', e => { if (e && e.key === JKEY) { JOBS = readJobs(); renderAll(); resumeRuns(); } });

/* ── 진행 데이터 = /ys_out/<id>/progress.json(R2 실시간 · 5초) + 결과 = result.json(10초 · 진행이 끝나면 매 틱) ── */
const STEPS = [
  { k: 'meta', label: '영상 정보 확인', ing: '영상 정보 확인 중…' },
  { k: 'stt', label: '받아쓰기', ing: '받아쓰는 중…' },
  { k: 'plan', label: '인사이트 정리', ing: '인사이트 정리 중…' },
  { k: 'voice', label: '목소리 입히기', ing: '목소리 입히는 중…' },
  { k: 'img', label: '장면 그림', ing: '장면 그림 그리는 중…' },
  { k: 'vid', label: '장면 영상', ing: '장면 영상 만드는 중…' },
  { k: 'render', label: '영상 만들기', ing: '영상 만드는 중…' },
  { k: 'upload', label: '올리기', ing: '올리는 중…' },

const ST_OK = ['wait', 'run', 'done', 'skip', 'fail'];
const PROG = {};   // id → 마지막으로 읽은 progress.json(메모리)
async function getJSON(u) {

}
const POLL_MS = 5000, STALL_MS = 50 * 60e3, LIMIT_MS = 100 * 60e3;   // 무갱신 50분(받아쓰기 한 단계 최장 45분) · 절대 100분(잡 상한 75분 + 대기) — 성공할 작업을 먼저 실패로 굳히지 않는다

  let stop = false;

  try {
    for (let n = 0; !stop; n++) {
      const j = jobOf(id); if (!j || j.status !== 'run') return;
      const p = await getJSON(base + 'progress.json');
      if (p && typeof p === 'object' && Array.isArray(p.steps)) { PROG[id] = p; learn(id, p); if (FOCUS === id) paintCard(); }
      const pu = PROG[id] && +PROG[id].updated ? (+PROG[id].updated > 1e12 ? +PROG[id].updated : +PROG[id].updated * 1000) : 0;
      const late = Date.now() - t0Of(j) > LIMIT_MS || Date.now() - Math.max(t0Of(j), pu) > STALL_MS;
      if (!PROG[id] && n > 0 && n % 12 === 0 && Date.now() - t0Of(j) > 60e3) { try { fetch('/api/ys?rescue=1', { cache: 'no-store' }); } catch (e) {} }   // 러너가 아직 안 섰다 = 발사 실패 착지분 재발사 요청(서버 rescueJobs · 멱등)
      const ended = !!(p && (p.state === 'done' || p.state === 'fail'));
      if (n % 2 === 0 || ended || late) {

        if (d && typeof d === 'object' && (d.error || d.video)) { land(id, d); return; }
      }
      if (p && p.state === 'fail') { failJob(id, failWhy(p), stepFailed(p)); return; }
      if (late) { failJob(id, '오래 진행 소식이 없어 추적을 멈췄어 — 나중에 완성되면 완성작 목록에 저절로 올라와.', 'timeout'); return; }

function stepFailed(p) { const s = (p.steps || []).find(x => x && x.st === 'fail'); return s ? String(s.k || '') : ''; }
function failWhy(p) { const s = (p.steps || []).find(x => x && x.st === 'fail'); return String(p.error || (s && s.note) || '진행 중 실패(사유 미기재)'); }
function compactSteps(p, failed) { return p && Array.isArray(p.steps) ? p.steps.map(s => ({ k: s.k, st: failed && s.st === 'run' ? 'fail' : s.st, note: s.note || '', t0: +s.t0 || 0, t1: +s.t1 || 0, budget: +s.budget || 0 })) : null; }
function learn(id, p) {   // 진행에서 알게 된 제목 = 작업 이름표(레일 진행 중 행)로 올린다 · 바뀔 때만 저장
  const t = p.title ? String(p.title).slice(0, 80) : '';
  const j = jobOf(id); if (!j || !t || j.title === t) return;
  mutate(a => { const x = a.find(y => y.id === id); if (x) { x.title = t; x.lbl = t; } });
}
function land(id, d) {

    infographic: d.infographic || '', report: d.report || '', scenes: +d.scenes || 0, voice: d.voice || '', img: d.img || '', img_used: +d.img_used || 0, vid_used: +d.vid_used || 0,
    ratio: d.ratio === '16:9' || d.ratio === '9:16' ? d.ratio : '', voice_name: d.voice_name ? String(d.voice_name).slice(0, 60) : '', voice_why: d.voice_why ? String(d.voice_why).slice(0, 160) : '', tr_src: d.tr_src || '', notes: Array.isArray(d.notes) ? d.notes.slice(0, 12).map(String) : [], generated: d.generated || '' };
  mutate(a => { const x = a.find(y => y.id === id); if (!x) return;
    x.status = 'done'; x.t1 = Date.now(); x.res = res; if (res.title) { x.title = res.title.slice(0, 80); x.lbl = x.title; }
    const p = PROG[id]; if (p) { x.steps = compactSteps(p); x.pct = 100; x.el = elapsedOf(x, p); x.btot = +p.budget_total || 0; } });
  try { if (window.nmRail && res.video) nmRail.add({ url: res.video, poster: res.poster, cap: '유튜브', dlname: 'short.mp4' }); } catch (e) {}   /* 결과 레일 적재 = 영상 5탭 공용 이력(nomute_cap_hist) · 실패해도 이 화면 무손상 */
  settleFocus(id); renderAll();
  setTimeout(loadHist, 4000);   // 워크플로가 R2 완성작 목록(_hist.json)을 갱신한다 → 잠시 뒤 다시 읽는다
}

    x.status = 'err'; x.t1 = Date.now(); x.error = String(why || '실패'); x.errStep = step === 'timeout' ? '' : (step || ''); x.errKind = step === 'timeout' ? 'timeout' : '';
    const p = PROG[id]; if (p) { x.steps = compactSteps(p, true); x.pct = pctOf(x, p); x.el = elapsedOf(x, p); x.btot = +p.budget_total || 0; } });

}
function nextAct(j) {   // 다음 행동 = 실패한 단계로 가른다(입력·외부 장애·코드 오류를 한 문장으로 뭉치지 않는다)
  if (j.errKind === 'timeout') return 'GitHub Actions의 ys-make 실행 기록을 확인하고, 멈춰 있으면 다시 생성해줘.';
  if (j.errStep === 'stt') return '자막이 있는 영상으로 해보거나, 음성 설정의 받아쓰기를 「유튜브 자막 우선」으로 바꿔 다시 생성해줘.';
  return '위 사유대로 조치한 뒤 다시 생성해줘. 같은 사유가 반복되면 GitHub Actions의 ys-make 실행 기록을 확인해.';   // 사유 문장(러너)이 입력·외부 장애·설정 문제를 이미 가른다 — 단계만 보고 조치를 추측하지 않는다
}

/* ── 화면 주인(FOCUS) = 카드·결과·모니터가 보여 주는 작업 1건 · 기본 = 진행 중 최신 → 없으면 최신 ── */
let FOCUS = null, SHOWURL = null;
function pickFocus() {
  if (FOCUS && jobOf(FOCUS)) return FOCUS;
  const run = JOBS.find(j => j.status === 'run');
  FOCUS = (run || JOBS[0] || {}).id || null;
  return FOCUS;
}
function settleFocus(id) {   // 끝난 작업이 화면을 가져가는 건 지금 화면 주인이 진행 중이 아닐 때만(남의 진행 화면을 덮지 않는다)
  const f = FOCUS && jobOf(FOCUS);
  if (!f || f.id === id || f.status !== 'run') { FOCUS = id; SHOWURL = null; }
}

/* ── 프로그램 모니터 = 화면 주인 완성본(9:16) 재생 · 없으면 빈 상태(카드 제작 정본) ── */
const EMPTY_MON = $('#mon').innerHTML;
const DL_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + D.down + '"/></svg>';
let _monSrc = '';

function paintMonitor() {

  const poster = (!SHOWURL && j && j.res && j.res.poster) || '';
  const yt = !url && !TYPE_ON ? ytCheck($('#url').value) : { ok: false };   // 완성본이 없을 때만 = 붙여넣은 링크의 썸네일 미리보기
  const key = url || (yt.ok ? 'yt:' + yt.id : '');
  if (key === _monSrc) return;
  _monSrc = key;
  if (!url && yt.ok) {
    mon.innerHTML = '<div class="ytpv"><div class="cpv-stage"><img alt="" decoding="async" src="https://i.ytimg.com/vi/' + encodeURIComponent(yt.id) + '/hqdefault.jpg"></div></div>';
    mon.querySelector('img').onerror = () => { _monSrc = ''; mon.innerHTML = EMPTY_MON; };   // 썸네일 없음 = 빈 무대로
    return;
  }
  if (!url) { mon.innerHTML = EMPTY_MON; return; }
  mon.innerHTML = '<video src="' + esc(url) + '"' + (poster ? ' poster="' + esc(poster) + '"' : '') + ' playsinline loop preload="metadata"></video>'
    + '<button type="button" class="monplay" aria-label="재생 — 탭=재생/일시정지"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>'
    + '<a class="imgdl dlbtn" href="' + esc(dlHref(url, 'short.mp4')) + '" download="short.mp4" aria-label="숏폼 내려받기" title="숏폼 내려받기">' + DL_ICON + '</a>'
    + '<div class="monseek" role="slider" tabindex="0" aria-label="진행 위치 — 탭·드래그=이동" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>';
  const v = mon.querySelector('video'), pb = mon.querySelector('.monplay'), sk = mon.querySelector('.monseek'), fill = sk.querySelector('i');
  v.onclick = () => { if (v.paused) v.play(); else v.pause(); };
  v.onplay = () => { pb.hidden = true; }; v.onpause = () => { pb.hidden = false; };

/* ══ 진행 상황 카드 ══ DOM은 화면 주인이 바뀔 때만 새로 만든다(모핑 인스턴스·게이지 전이 유지) · 폴마다 = 상태만 갱신 */
let CARD = null, _tick = null;

  const src = (p && Array.isArray(p.steps)) ? p.steps : (Array.isArray(j.steps) ? j.steps : []);
  const by = {}; src.forEach(s => { if (s && s.k) by[s.k] = s; });
  const mode = ((j.opts && j.opts.img) || DEF.img) === 'none' ? 'motion' : ((j.opts && j.opts.img) || DEF.img);
  const off = k => (k === 'img' && mode === 'motion') || (k === 'vid' && mode !== 'grok');   // 그 방식에 없는 단계 = 건너뜀
  return STEPS.map(d => {

    if (j.status === 'err' && st === 'run') st = 'fail';   // 실패로 끝난 작업에 「진행 중」 단계가 남지 않게

}

  if (!eff.length) return 0;
  const got = eff.reduce((n, s) => n + (s.st === 'done' ? 1 : s.st === 'run' ? .5 : 0), 0);

  HIST.forEach(it => { if (!seen[it.id]) { seen[it.id] = 1; items.push(it); } });
  JOBS.filter(j => j.status === 'done' && j.res && j.res.video && !seen[j.id]).forEach(j => { seen[j.id] = 1; const r = j.res;
    items.push({ id: j.id, ts: +j.t1 || t0Of(j), title: r.title || j.title || '', short: r.title || j.title || '', channel: r.channel, poster: r.poster, video: r.video, infographic: r.infographic, report: r.report, dur: r.dur, ratio: r.ratio || (j.opts && j.opts.ratio) || '9:16', local: 1 }); });
  items.sort((x, y) => (y.ts || 0) - (x.ts || 0));
  HIST.forEach(it => { const lj = JOBS.find(j => j.id === it.id);
    if (lj && lj.status !== 'done') mutate(a => { const x = a.find(y => y.id === it.id); if (x) { x.status = 'done'; x.t1 = it.ts || Date.now(); x.error = ''; x.res = { title: it.title, channel: it.channel, dur: it.dur, video: it.video, poster: it.poster, infographic: it.infographic, report: it.report, ratio: it.ratio, notes: [] }; } });   // 늦게 끝난 성공 = 결과로 승격
  });
  HIST.forEach(it => { if (!JOBS.some(j => j.id === it.id)) HJOBS[it.id] = { id: it.id, status: 'done', title: it.title, t1: it.ts, _hist: 1,
    res: { title: it.title, channel: it.channel, dur: it.dur, video: it.video, poster: it.poster, infographic: it.infographic, report: it.report, ratio: it.ratio, notes: [] } }; });
  const sig = items.map(it => it.id + (it.poster ? 1 : 0)).join(',');
  $('#histSec').hidden = !items.length;
  $('#histN').textContent = items.length ? items.length + '편 · 전 기기 공유' : '';
  if (sig === _hsig) return; _hsig = sig;
  $('#ysHist').innerHTML = items.slice(0, 60).map(it => '<div class="hist-it"><div class="hist-hd">' + esc(it.ts ? histTime(it.ts) : '') + '</div>'
    + '<div class="hist-thumb hist-go' + (it.ratio === '16:9' ? ' r169' : '') + '" role="button" tabindex="0" data-hid="' + esc(it.id) + '" title="탭 = 이 결과 열기">'
    + (it.poster ? '<img src="' + esc(it.poster) + '" alt="" loading="lazy">' : '<video src="' + esc(it.video) + '" muted playsinline preload="metadata"></video>')
    + (it.dur ? '<span class="hist-cap">' + esc(fmtDur(it.dur)) + '</span>' : '') + '</div>'
    + '<div class="ysh-t">' + esc(it.short || it.title) + '</div></div>').join('');
}
function openHist(id) {
  if (!jobOf(id)) return;
  FOCUS = id; SHOWURL = null; _resFor = ''; renderAll();
  const r = $('#res'); if (r && !r.hidden) { try { r.scrollIntoView({ behavior: RM() ? 'auto' : 'smooth', block: 'start' }); } catch (e) {} }
}
$('#ysHist').addEventListener('click', e => { const t = e.target.closest('[data-hid]'); if (t) openHist(t.dataset.hid); });
$('#ysHist').addEventListener('keydown', e => { const t = e.target.closest('[data-hid]'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openHist(t.dataset.hid); } });

function renderAll() { JOBS = readJobs(); pickFocus(); paintSpec(); paintMonitor(); paintCard(); paintRes(); paintErrs(); paintHist(); }

/* ── 진행 중 행 탭(레일) = 그 작업 카드로 · 완료 타일 탭 = 위 모니터에서 다시 보기(nm-rail 훅 계약) ── */
window.nmJobOpen = function (id) {
  const j = jobOf(id) || readJobs().find(x => x.id === id);
  if (!j) return false;
  FOCUS = id; SHOWURL = null;
  try { if (j.status === 'run' && window.nmJobs && !nmJobs.busy(JKEY, id)) poll(id); } catch (e) {}
  renderAll(); scrollToCard();
  const c = $('#tk'); if (c) { c.classList.add('thfocus'); setTimeout(() => c.classList.remove('thfocus'), 2200); }
  return true;
};
window.nmJobShow = function (url) {
  const j = JOBS.find(x => x.res && x.res.video === url);
  if (j) { FOCUS = j.id; SHOWURL = null; } else SHOWURL = url;
  renderAll();
};
window.nmRefresh = () => { renderAll(); resumeRuns(); loadVoices(); loadHist(); };   // 부모 셸 헤더 새로고침·복귀 재동기 훅(nm-sync) · 목소리 목록도 다시 읽는다
let FIRING = false;
window.nmSyncBusy = () => FIRING;   // 발사 중 = 새 배포 자동 탑재 미룸

/* ── 발사 ── */
let GO_M = null;
function goFlash(ok) {
  if (!GO_M) return;
  GO_M.to(ok ? D.check : D.x);
  $('#go').classList.toggle('ok', ok); $('#go').classList.toggle('bad', !ok);
  setTimeout(() => { GO_M.to(D.arrow); $('#go').classList.remove('ok', 'bad'); }, ok ? 1200 : 1600);
}
function shake() { const g = $('#go'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); setTimeout(() => g.classList.remove('shake'), 460); }
async function fire() {
  const go = $('#go'); if (FIRING) return;
  const v = ytCheck($('#url').value);
  if (!v.ok) { shake(); goFlash(false); setMsg('#urlMsg', v.msg, 'err'); return; }   // 입력 문제 = 요청 전에 막는다(포커스 안 줌 = 폰 키보드가 불필요하게 안 올라온다)
  const ask = $('#ask').value.trim().slice(0, 300);
  const o = { voice: opts.voice, stt: opts.stt, img: opts.img, len: opts.len, font: opts.font, el_voice: opts.voice === 'eleven' && VID_RE.test(opts.el_voice || '') ? opts.el_voice : '',
    ratio: opts.ratio, subbg: opts.subbg, subop: Math.max(0, Math.min(100, Math.round(+opts.subop))) };
  const body = { url: v.url, ask: ask, opts: o };   // 계약(260928) = {url, ask, opts:{…}} · 백엔드는 옛 최상위 필드도 받는다
  FIRING = true; go.disabled = true;
  setMsg('#urlMsg', '접수 중…');
  let res = null, j = null;
  try {
    try { res = await fetch('/api/ys', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); }
    catch (e) { setMsg('#urlMsg', '연결 실패 — 네트워크를 확인하고 다시 눌러줘.', 'err'); goFlash(false); return; }   // 외부(회선) 장애
    try { j = await res.json(); } catch (e) { j = null; }
    if (!res.ok || !j || !j.ok || !j.id) {
      const why = (j && j.error) || ('서버 응답 ' + res.status);
      setMsg('#urlMsg', (res.status >= 400 && res.status < 500 ? '접수 거절 — ' : '서버 오류 — ') + why + (res.status >= 500 ? '\n잠시 뒤 다시 눌러줘.' : ''), 'err');
      goFlash(false); return;
    }
    const id = String(j.id);
    const saved = mutate(a => { a.unshift({ id: id, out: j.out || ('ys_out/' + id + '/result.json'), status: 'run', t0: Date.now(), lbl: '유튜브 · ' + v.id, src: v.url, vid: v.id, opts: Object.assign({}, o) }); });
    FOCUS = id; SHOWURL = null;
    goFlash(true);
    if (j.via === 'r2-queue') setMsg('#urlMsg', '깃허브 발사가 지연돼 대기열에 넣었어 — 이 화면이 열려 있으면 1분마다 자동으로 다시 발사해.', 'warn');
    else setMsg('#urlMsg', saved ? '접수됨 — 진행 상황은 아래 카드에 나와.' : '접수됨 — 다만 이 기기 저장소가 막혀 새로고침하면 진행 추적이 끊겨.', saved ? 'ok' : 'warn');
    renderAll(); poll(id); scrollToCard();
  } finally { FIRING = false; paintGo(); }
}
$('#go').addEventListener('click', fire);

/* ── 부팅 ── */
paintOpts(); paintMac(); macArm(); loadVoices(); paintUrlState(); loadHist();
renderAll();
morphReady.then(() => { if (!GO_M) GO_M = mk($('#goP'), D.arrow); });
readJobs().filter(j => j && j.status === 'run' && j.id).forEach(j => poll(j.id));   // 진행 중 작업 전건 재개(vd 계승)
readJobs().filter(j => j && j.status === 'err' && j.errKind === 'timeout' && Date.now() - t0Of(j) < 24 * 3600e3).forEach(async j => {   // 추적만 멈춘 작업 = 결과가 왔으면 성공으로 되살린다
  const d = await getJSON(j.out || ('ys_out/' + encodeURIComponent(j.id) + '/result.json')); if (d && typeof d === 'object' && (d.video || d.error)) land(j.id, d); });
// 미리보기 확대(돋보기) = vd·tr PVZOOM 정본 동문 사본
const PVZOOM = { K: 'nm.pvzoom',
  get() { try { return localStorage.getItem(this.K) === '1'; } catch (_) { return false; } },
  set(on) { try { on ? localStorage.setItem(this.K, '1') : localStorage.removeItem(this.K); } catch (_) {} } };
(function () {
  const td = document.querySelector('.dock'), b = document.getElementById('cpZoom'); if (!td || !b) return;
  const paint = on => { td.classList.toggle('dockzoom', on); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.setAttribute('aria-label', on ? '미리보기 원상복귀' : '미리보기 확대'); b.title = on ? '탭=원상복귀' : '탭=미리보기 확대 · 다시 탭=원상복귀'; };
  paint(PVZOOM.get());
  b.addEventListener('click', () => { const on = !td.classList.contains('dockzoom'); paint(on); PVZOOM.set(on); });
})();
</script>
