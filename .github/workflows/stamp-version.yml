name: stamp-version
# 배포 버전 도장 — main에 앱 코드(뷰어 HTML·sw.js·functions)가 바뀌면 그 커밋 SHA·KST 시각을
# viewer/index.html 의 BUILD_STAMP 상수에 구워, 화면(설정 메뉴 하단 .lp-ver)에 '지금 돌아가는 버전'을 박는다.
# ── 왜(운영자 Q43~44 "고쳤는데 그대로 · 조치됐다는데 안 됨") ──
#   커밋 SHA는 깃허브에만 있고 화면엔 없다 + SW 셸 캐시(sw.js)가 옛 index를 서빙할 수 있어,
#   "고쳤는데 그대로"의 진위(구버전 열람 vs 실미해결)를 스샷만으로 못 가렸다.
#   index.html 자체에 구우므로, SW-캐시된 옛 셸은 '자기 옛 도장'을 그대로 보여준다 = 스샷이 스스로 신원을 밝힌다.
#   (별도 파일 fetch로 하면 네트워크-최신을 보여줘 캐시된 옛 화면을 '최신'으로 오판 → index 내장이 정답.)
# ── 루프 차단(작성자 기준 · 260717 재부팅) ──
#   도장 커밋도 index.html을 바꿔 이 워크플로를 재트리거하므로 재실행을 걸러야 한다. 가드 = **커밋 작성자**가 nomute-bot이면 스킵.
#   ⚠️ 옛 가드(커밋 메시지에 '[stamp]' 문자열 포함 여부)는 실패했다(첫 배포 run 29567437001 = skipped): 이 기능을 *소개하는* 커밋 본문이
#      "[stamp] 마커 if로 루프차단"이라고 [stamp]를 *서술*해서 contains가 오매칭 → 자기 자신을 스킵 = 도장 영영 안 찍힘("조치했다는데 안 됨"의 실사례).
#      작성자 기준은 산문으로 못 속인다(도장 커밋만 nomute-bot 저자 · 병렬머지·기능커밋은 운영자/GitHub 저자 = 실행). 봇 커밋은 애초에 paths(viewer HTML) 무접촉이라 무관.
#   ⚠️ Cloudflare Pages 빌드 skip 키워드([skip ci]/[CI Skip] 등) 사용 금지 = 도장 커밋도 정상 배포돼야 화면에 반영됨.
# ── 트레이드(수용) ──
#   코드 변경당 배포 2회(코드 커밋 → 도장 커밋) + SW 새버전 토스트가 도장분에 1회 더 뜰 수 있음(탭 1회로 최신 수렴 = 무해).
# ── 롤백 ──
#   이 파일 삭제 = 도장 '갱신'만 멈춤(마지막 값 잔존·무해) · 완전 원복 = index.html BUILDSTAMP 줄을 'dev'로 환원.
on:
  push:
    branches: [main]
    paths:                     # live-smoke.yml paths와 동일 집합(평의회 260802 — 부분집합이면 js/css/_headers 푸시가 도장 없이 배포돼 라이브 검문의 수렴 대기가 원리적으로 불가 = 침묵 스킵/오MISS의 근원)
      - 'viewer/*.html'
      - 'viewer/*.js'
      - 'viewer/*.css'
      - 'viewer/_headers'
      - 'functions/**'
  workflow_dispatch:   # 수동 도장(백필·검증용 · paths 무관 상시 실행 · 첫 배포 스킵 사고 후 즉시 검증 경로로 추가)
permissions:
  contents: write
concurrency:
  group: stamp-version
  cancel-in-progress: true   # 연속 코드 커밋 = 최신만 도장(중간분 취소 무해 — 최종 배포본 SHA만 의미)
jobs:
  stamp:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.author.name != 'nomute-bot' }}   # 도장 커밋(nomute-bot 저자) 재트리거 차단(무한루프 봉쇄 · 산문 오매칭 불가 · CF 배포는 정상) · 수동 발사는 항상 실행
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 도장 굽기(커밋 SHA·KST → index.html BUILD_STAMP)
        run: |
          set +e
          SHA="${GITHUB_SHA::7}"                             # 지금 배포되는 코드 커밋 = 트리거 SHA 고정(평의회 260802 — 구 rev-parse HEAD는 체크아웃 큐 지연 사이 낀 봇 데이터 커밋 SHA를 구워 라이브 검문 수렴이 어긋나던 레이스 · dispatch도 GITHUB_SHA=main tip이라 동작 동일)
          TS=$(TZ='Asia/Seoul' date '+%y%m%d_%H%M')          # KST(러너=UTC라 TZ 강제 · CLAUDE.md [12])
          git config user.name "nomute-bot"
          git config user.email "bot@users.noreply.github.com"
          # ⚠ 260816 실사고 봉합 — 구판은 `git pull --rebase --autostash -X ours` 4회 루프였는데, 붐비는 main에서
          #   **첫 시도가 꼬이면 4회 전부 같은 자리에서 죽는다**: autostash 가 남긴 미스테이지 변경 때문에 다음 라운드가
          #   「cannot rebase: You have unstaged changes」로 시작조차 못 하고, 그 사이 로컬은 계속 뒤처져 push 는 4연속
          #   non-fast-forward 거부 → 스텝은 warning 만 남기고 **rc 0(초록)** 으로 끝난다(실측 run 31936404895 =
          #   f7249d0 도장 미착지인데 잡은 success). 도장이 없으면 라이브 도장이 트리거 SHA 가 될 방법이 없으므로
          #   **배포 검문이 12분 대기 후 반드시 「배포 미수렴」으로 실패**한다 = 그날 검문 적색의 진범(실측 run 31936404904).
          # → git_land.sh 의 「리베이스를 안 쓴다」 원리만 이식한다(⚠ 그 헬퍼 자체는 코얼레싱 접두를 커밋 메시지에
          #   자동으로 붙이므로 **도장 축에는 못 쓴다** = 도장은 스킵 금지 축 · 명문 = git_land.sh 헤더 · 게이트 = check_pages_skip):
          #   매 시도가 {최신 main 으로 reset → 도장 재굽기 → 단일 커밋 → push} 라 꼬임이 구조적으로 불가능하고,
          #   항상 origin/main 의 직계 자식 1커밋이라 경합에 져도 다음 시도에서 그대로 따라잡는다.
          #   ⚠ reset --hard 안전 조건 = 이 잡은 도장 외 산출이 0(안 밀린 로컬 커밋이 없다) — pc_lane 의 「안 밀린 커밋
          #   보호」가 필요한 다스테이지 레인과 다른 조건이다.
          stamp_once() {   # BUILDSTAMP 마커 줄만 치환 = 마커 영속(다음 배포도 재매칭) · 값은 'dev'·직전 도장 무관하게 통째 교체
            sed -i "s|const BUILD_STAMP = '[^']*';\(.*\)/\*BUILDSTAMP\*/|const BUILD_STAMP = '${SHA} · ${TS}';\1/*BUILDSTAMP*/|" viewer/index.html
          }
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main || { echo "::warning::기점 재동기 실패 — 재시도 $i"; sleep $((2**i)); continue; }
            stamp_once
            git add viewer/index.html
            git diff --cached --quiet && { echo "도장 변동 없음 — 생략"; exit 0; }
            git commit -q -m "chore(stamp): ${SHA} 배포 버전 도장 [stamp]"
            git push -q origin HEAD:main && { echo "도장 착지 ✓ (${SHA} · 시도 ${i})"; exit 0; }
            echo "도장 push 재시도 $i(경합 = 다음 라운드가 최신 기점에서 다시 얹는다)"; sleep $((2**i))
          done
          # ⚠ 실패는 실패로 낸다(구판은 warning 만 내고 rc 0 = 「도장 워크플로는 초록인데 도장이 없다」는 거짓 초록이었고,
          #   그 거짓 초록 때문에 진범이 배포 검문 쪽으로 보였다) — 도장 미착지 = 그 배포의 검문이 반드시 실패하는 상태다.
          echo "::error::도장 push 실패(6회 소진) — 라이브 도장이 ${SHA} 로 안 바뀐다 = 이 배포의 라이브 검문은 반드시 「배포 미수렴」으로 적색"
          exit 1
