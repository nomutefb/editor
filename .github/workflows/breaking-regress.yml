name: breaking-regress

# 긴급 판정 회귀 전용. 후보 갱신·발송·착지 명령 없이 기존 judge()만 호출한다.
# 결과는 3일 artifact로 회수한다. 통과 도장을 반영한 뒤 같은 입력이면 추가 LLM 호출을 생략한다.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/breaking_judge.py'
      - '.github/scripts/rubric_regress.py'
      - '.github/scripts/rubric_regress_cases.json'
      - '.github/scripts/regress_lib.py'
      - 'shared/claude_py.py'
      - 'apps/news/major_award_winners.json'
      - '.github/workflows/breaking-regress.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '기존 검증이 유효해도 실제 LLM 회귀 3회를 다시 실행'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: breaking-regress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regress:
    # pull_request_target를 사용하지 않는다. fork PR에는 checkout·Secrets 주입 모두 금지한다.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      BREAKING_MODEL: claude-opus-5-5
      BREAKING_EFFORT: max
      BREAKING_TIMEOUT: '900'
      BREAKING_SAFE: '1'
      REGRESS_RUNS: '3'
      PYTHONUTF8: '1'
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Decide whether new LLM verification is needed
        id: needed
        env:
          FORCE_REGRESS: ${{ inputs.force && '1' || '0' }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path

          stamp_path = Path('.github/scripts/rubric_regress_stamp.json')
          ledger_path = Path('.github/scripts/regress_runs.jsonl')
          watched = [
              '.github/scripts/breaking_judge.py', '.github/scripts/rubric_regress.py',
              '.github/scripts/rubric_regress_cases.json', '.github/scripts/regress_lib.py',
              'shared/claude_py.py', 'apps/news/major_award_winners.json', '.github/workflows/breaking-regress.yml',
          ]
          reason = 'explicit manual verification' if os.environ['FORCE_REGRESS'] == '1' else ''
          if not reason:
              check = subprocess.run([sys.executable, '.github/scripts/rubric_regress.py', '--check'])
              if check.returncode:
                  reason = 'current rubric or cases need a new verification stamp'
          if not reason:
              try:
                  stamp = json.loads(stamp_path.read_text(encoding='utf-8'))
                  rows = [json.loads(line) for line in ledger_path.read_text(encoding='utf-8').splitlines() if line.strip()]
                  last = next(row for row in reversed(rows) if row.get('kind') == 'breaking')
                  valid = (last.get('ver') == stamp.get('regress_ver')
                           and last.get('cases') == stamp.get('cases')
                           and last.get('runs') == stamp.get('runs') == 3
                           and last.get('rcs') == [0, 0, 0] and last.get('pass') is True)
                  if not valid:
                      reason = 'existing stamp lacks three successful recorded LLM runs'
              except (OSError, ValueError, StopIteration, TypeError):
                  reason = 'existing verification evidence is missing or unreadable'
          if not reason:
              stamp_commit = subprocess.check_output(
                  ['git', 'log', '-1', '--format=%H', '--', str(stamp_path)], text=True).strip()
              shallow_path = Path(subprocess.check_output(
                  ['git', 'rev-parse', '--git-path', 'shallow'], text=True).strip())
              shallow_commits = set(shallow_path.read_text(encoding='ascii').splitlines()) if shallow_path.is_file() else set()
              # 얕은 이력의 경계는 파일을 처음 만든 커밋처럼 보인다. 도장 생성 시점의 증거로 쓰지 않는다.
              if stamp_commit in shallow_commits:
                  reason = 'shallow history cannot establish the verification stamp commit'
              # 케이스 기대값·실행기 변경은 기존 해시/개수 검사만으로 잡히지 않는다.
              elif not stamp_commit or subprocess.run(
                  ['git', 'diff', '--quiet', stamp_commit, 'HEAD', '--', *watched]).returncode:
                  reason = 'regression inputs changed since the committed verification stamp'
          run = bool(reason)
          message = ('RUN: ' + reason) if run else 'SKIP: unchanged inputs already passed all three LLM runs'
          print(message)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('run=' + ('true' if run else 'false') + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('Commit: `' + os.environ['EXPECTED_SHA'] + '`\n\n' + message + '\n')
          PY

      - name: Setup Node
        if: steps.needed.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Claude Code CLI
        if: steps.needed.outputs.run == 'true'
        run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code

      - name: Run actual regression once with three LLM rounds
        id: regression
        if: steps.needed.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', vars.ACTIVE_ACCOUNT || 'EMS1130N')] }}
          CLAUDE_CODE_OAUTH_TOKEN_ALT: ${{ (vars.ACTIVE_ACCOUNT || 'EMS1130N') == 'MUTENO' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENO }}
          CLAUDE_CODE_OAUTH_TOKEN_ALT2: ${{ (vars.ACTIVE_ACCOUNT || 'EMS1130N') == 'EMS1130N' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130N }}
          CLAUDE_CODE_OAUTH_TOKEN_ALT3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130M }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::error::Active account OAuth secret is missing; no verification stamp produced."
            exit 1
          fi
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          # 실패 시 checkout에 있던 이전 도장이 이번 실행의 산출물로 회수되지 않게 한다.
          rm -f .github/scripts/rubric_regress_stamp.json
          python3 .github/scripts/rubric_regress.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.github/scripts')
          cases = json.loads((root / 'rubric_regress_cases.json').read_text(encoding='utf-8'))['cases']
          stamp = json.loads((root / 'rubric_regress_stamp.json').read_text(encoding='utf-8'))
          rows = [json.loads(line) for line in (root / 'regress_runs.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          last = next(row for row in reversed(rows) if row.get('kind') == 'breaking')
          # 기존 다수결 러너는 일부 호출 실패도 수용한다. 클라우드 통과는 실제 3회 성공을 추가 요구한다.
          if not (last.get('pass') is True and last.get('runs') == stamp.get('runs') == 3
                  and last.get('rcs') == [0, 0, 0]
                  and last.get('cases') == stamp.get('cases') == len(cases)
                  and last.get('ver') == stamp.get('regress_ver')):
              raise SystemExit('Three successful LLM rounds were not recorded; stamp is not accepted.')
          print(f'Accepted: {len(cases)} cases, three successful LLM rounds.')
          PY
          python3 .github/scripts/rubric_regress.py --check
          git diff --exit-code -- viewer/candidates.json push

      - name: Collect verification evidence
        if: ${{ always() && steps.needed.outputs.run == 'true' && (steps.regression.outcome == 'success' || steps.regression.outcome == 'failure') }}
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/breaking-regress"
          mkdir -p "$ARTIFACT_DIR"
          if [ -f .github/scripts/regress_runs.jsonl ] && ! git diff --quiet -- .github/scripts/regress_runs.jsonl; then
            cp .github/scripts/regress_runs.jsonl "$ARTIFACT_DIR/"
          fi
          if [ "$REGRESSION_OUTCOME" = success ]; then
            cp .github/scripts/rubric_regress_stamp.json "$ARTIFACT_DIR/"
          fi
          printf '\nRegression outcome: %s. A stamp is included only after full success.\n' "$REGRESSION_OUTCOME" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stamp and run ledger
        if: ${{ always() && steps.needed.outputs.run == 'true' && (steps.regression.outcome == 'success' || steps.regression.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: breaking-regress-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/breaking-regress/
          if-no-files-found: warn
          retention-days: 3
