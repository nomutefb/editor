name: sb-make

# 뷰어 콘티 폼(Pages Function /api/sb)이 발사 → 이야기 입력으로 claude -p(감독 모델 스위치 · storyboard-v1 스킬 런타임 Read)
#   → 텍스트 콘티 md → viewer/sb_out/<id>/board.md 커밋(폼이 폴링).
# 인증 = CLAUDE_CODE_OAUTH_TOKEN(구독 OAuth·무료, k-make와 동일). 시트 이미지·영상 생성 없음(0크레딧 초안 게이트).
# 감독(연출) 모델 = director 입력(opus|fable) — 촬영(클링/시댄스)과 2축 분리(apps/storyboard/260714_설계확정_2축분리_v1.md).
on:
  workflow_dispatch:
    inputs:
      id:
        description: '출력 id(타임스탬프)'
        type: string
      story:
        description: '이야기/기사 입력 텍스트'
        type: string
      director:
        description: '감독 모델(연출 축)'
        type: choice
        default: fable
        options:
          - fable
          - opus
          - gpt
      shoot:
        description: '촬영 레인(grok = 구독 자격 직결 · seedance = 힉스필드 2.5 720p 30초 한 발 · seedance20 = 2.0 720p 15초 두 발 · seedance5 = 2.5 720p 5초씩 쪼개 이어붙이기 · motion = 플랫 모션그래픽 사내 렌더 → mp4)'
        type: choice
        default: grok
        options:
          - grok
          - seedance
          - seedance20
          - seedance5
          - motion
      # ⚠⚠ 이 칸이 **열 번째이자 마지막**이다 — 깃허브가 받는 손입력 칸은 10개가 상한이고
      #   열한 번째를 만들면 발사 자체가 400 으로 죽는다(평점 레일 `rate.yml` 이 이미 그 벽에
      #   부딪혀 예약키 문법으로 우회했다). 다음에 값을 하나 더 실어야 하면 칸을 늘리지 말고
      #   기존 칸에 태워라.
      res:
        description: '화질(빈값 = 판 기본 · 720p·FHD·4K — 판마다 되는 값이 다르고 없는 이름을 보내면 러너가 멈춘다)'
        type: string
        default: ''
      sound:
        description: '영상 소리(1 = 켜기 · 0 = 끄기 · 촬영=grok 전용)'
        type: string
        default: '1'
      cutmax:
        description: '영상으로 구울 컷 수 상한(빈값 = 12 · 배선 확인은 1 로 두면 1컷만 = 값 최소)'
        type: string
        default: ''
      refimage:
        description: '레퍼런스 이미지도 생성(Gemini 종량제 · 시댄스·그록=항상 true · 모션=항상 false)'
        type: string
        default: 'true'
      base:
        description: '변형 기준 콘티 경로(sb_out/<id>/board.md · 빈값 = 신규)'
        type: string
        default: ''
      account:
        description: '이 실행에 쓸 계정(구독 OAuth)'
        type: choice
        default: MUTENO
        options:
          - NOMUTEFB
          - MUTENO
          - EMS1130G

# ⚠ **시댄스 판은 한 번에 하나만 돈다**(260812 실사고) — 그쪽 열쇠는 **쓸 때마다 새것으로 바뀌고
#   옛것이 죽는** 형태다. 두 판을 나란히 쏘면 둘이 같은 열쇠를 동시에 갈아서, 창구가 그걸
#   재사용으로 보고 **사슬을 통째로 끊는다**(그 뒤로는 전부 400 = 사람이 다시 로그인해야 산다).
#   러너 안 잠금은 러너 사이에선 무용지물이라 순서를 여기서 세운다.
# ⚠ **그록 판도 같은 줄에 세운다**(260812 8렌즈 검증) — 그쪽 열쇠도 회전형이고, 러너 안
#   파일 잠금·저장소는 **러너 사이를 못 건넌다**(판마다 새 기계 · 비밀값은 값 읽기가 아예
#   불가하고 되쓰기만 된다). 그록이 여태 안 죽은 건 구조가 지켜준 게 아니라 **아직 안
#   겹쳤을 뿐**이라, 겹치는 날 같은 모양으로 죽는다. 두 열쇠는 서로 다른 줄에 세워
#   그록 판과 시댄스 판이 서로를 기다리지는 않게 한다. 그림·모션 칸은 종전대로 병렬.
concurrency:
  group: ${{ startsWith(inputs.shoot, 'seedance') && 'nm-seedance-key' || (inputs.shoot == 'grok' && 'nm-grok-key' || format('sb-make-{0}', inputs.id)) }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sb:
    runs-on: ubuntu-latest
    # ⚠ **25분은 시댄스 렌더에 모자란다**(260813 실측) — 30초 한 발이 19분을 돌던 중 잡이
    #   시간 벽에 잘렸다. 발사는 이미 나갔고 결과만 못 받은 최악의 모양이라 값은 값대로 나간다.
    #   콘티만 뽑는 판은 5분이면 끝나므로 벽을 올려도 손해가 없다(안 쓰면 안 쓴다).
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1   # 최신 1커밋만 — 구 0은 원격 브랜치 567개 전체 히스토리를 받아 실측 105s를 먹었다(260810 · imggen run 30972520521 = 체크아웃 108s 중 워킹트리 쓰기는 3s뿐)
          # ⚡ 260810 sparse-checkout(scrape 카나리아 실증 = 같은 잡 A/B 20s→9s · 삭제 커밋 0건) — 목록 = 이 잡이 실행줄에서 여는 폴더뿐.
          #   빠지는 대형 = _versions 437M · docs 90M · 자료 75M · _산출 74M(어느 잡도 안 연다) · ⚠ git add/rm 대상은 전건 포함 검문 통과분.
          #   ⚠ prompts·.claude 는 「실행줄에서 여는 폴더」가 아니라 **스크립트가 여는 폴더**라 260810 목록에서
          #     통째로 빠졌고, 그 뒤 이 잡은 첫 줄에서 죽어 왔다(260811 실측 run 31535226803 =
          #     `grep: prompts/sb-make.md: No such file or directory` → 프리플라이트 exit 1).
          #     sbmake.sh 는 prompts/sb-make.md 를 읽고, 그 지침이 .claude/skills 두 벌을 Read 시킨다.
          sparse-checkout: |
            .github
            shared
            apps
            metrics
            viewer
            prompts
            .claude/hooks
            .claude/skills/storyboard-v1
            .claude/skills/master-sheet-v2
            messages

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install claude-code
        run: npm install -g @anthropic-ai/claude-code

      # 🔁 **콘티 재사용 = 촬영만 한다**(이야기 없이 기준 콘티만 준 경우).
      #    ⚠ 왜 필요했나 = 쏠 때마다 감독이 콘티를 새로 짜서 **같은 콘티를 두 방식으로 찍는 비교가
      #      구조적으로 불가능**했다(찍는 방식이 아니라 콘티가 달라져 무엇이 좋았는지 못 가른다).
      #      운영자가 말한 「스토리보드 보고 2차 승인」의 뒤쪽 절반도 이 길이 있어야 성립한다.
      #    ⚠ 입력 칸은 안 늘린다(발사 입력 10칸이 상한 · 11번째 = 발사 자체가 거절된다) —
      #      이야기가 비었고 기준 콘티가 있으면 그게 곧 「촬영만」이라는 뜻이다.
      - name: Reuse storyboard
        if: inputs.story == '' && inputs.base != ''
        env:
          IN_ID: ${{ inputs.id }}
          BASE: ${{ inputs.base }}
        run: |
          SRC="viewer/${BASE}"
          [ -s "$SRC" ] || { echo "::error::기준 콘티가 없다: $SRC"; exit 1; }
          mkdir -p "viewer/sb_out/${IN_ID}"
          cp "$SRC" "viewer/sb_out/${IN_ID}/board.md"
          # ⚠ 참조 그림·시트도 같이 물려받는다 — 콘티만 물려받고 그림을 다시 구우면 ⓐ 값이 또
          #   나가고 ⓑ **첫 장면이 달라진다**(그림 엔진은 매번 다르게 그린다). 엔진만 바꿔 견주려는
          #   자리에서 그림이 같이 변하면 무엇 때문에 달라졌는지 못 가른다(같은 콘티 = 같은 그림).
          BD="$(dirname "$SRC")"
          for f in ref.json sheet.json; do
            [ -s "$BD/$f" ] && cp "$BD/$f" "viewer/sb_out/${IN_ID}/$f" && echo "  $f 물려받음"
          done
          echo "콘티 재사용 ✓ $SRC → sb_out/${IN_ID}/board.md ($(wc -c < "$SRC") bytes · 감독 호출 0)"

      - name: Make storyboard
        if: inputs.story != '' || inputs.base == ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO')] }}
          CLAUDE_CODE_OAUTH_TOKEN_ALT: ${{ (inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO') == 'NOMUTEFB' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_NOMUTEFB }}   # 서브1 폴오버(k-make와 동일 체인 MUTENO→NOMUTEFB→EMS1130G→MUTENONA)
          CLAUDE_CODE_OAUTH_TOKEN_ALT2: ${{ (inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO') == 'MUTENO' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENO }}   # 서브2 폴오버(체인 3번째)
          CLAUDE_CODE_OAUTH_TOKEN_ALT3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENONA }}   # 서브3 폴오버(체인 실꼬리)
          ACTIVE_ACCOUNT: ${{ inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO' }}
          STORY: ${{ inputs.story }}
          DIRECTOR: ${{ inputs.director }}
          BASE: ${{ inputs.base }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # GPT 감독 레인(director=gpt)만 사용 — 미등록이면 gpt 발사가 명시 실패(error.log)
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}   # 선택 — 비우면 gpt-5.6-sol(sb_gpt.py 기본값)
          IN_ID: ${{ inputs.id }}
        run: |
          [ -n "$IN_ID" ] || { echo "::error::id 없음"; exit 1; }
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN_<계정> 시크릿이 비어있음"; exit 1
          fi
          # OAuth를 조용히 덮어쓰는 변수 방어적 제거(k-make와 동일)
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          bash .github/scripts/sbmake.sh "$IN_ID"

      # 🔍 콘티 검증 = **인용한 연출 모듈이 라이브러리에 실재하는가**(운영자 260813).
      #    지어낸 번호를 적어도 콘티는 멀쩡해 보이고 영상도 나온다 = 라이브러리가 죽어도 화면
      #    증상이 0인 구조였다. 산출에 숫자로 박아 다음 세션이 추측할 자리를 없앤다.
      #    막지는 않는다(경고만) — 콘티는 이미 나온 뒤라 여기서 죽이면 그 판이 통째로 버려진다.
      - name: Storyboard audit
        run: |
          MD="viewer/sb_out/${{ inputs.id }}/board.md"
          [ -s "$MD" ] || { echo "콘티 검증: 미시도(board.md 없음)"; exit 0; }
          python3 .github/scripts/sb_audit.py "$MD" "viewer/sb_out/${{ inputs.id }}"

      # ⚠️ 레퍼런스 이미지 = 콘티 컷 그림(k-make.yml 동일 스텝 계승 · 직영 Gemini→R2 · 260730).
      #    게이트 = refimage(운영자 Q1161): 시댄스·그록 = 항상 true · 모션 = 항상 false.
      #    산출 = sb_out/<id>/{board.md + ref.json|ref.jpg} 한 폴더.
      #    ⚠ 그록 레인에서 이 그림은 「참조」가 아니라 **영상의 첫 장면**이다(운영자 260811
      #      「제미나이가 그린 거로 감독이 프롬프팅해서 영상 뽑는다」) — 그림 실패 = 영상 불가라
      #      이 스텝이 그록 레인의 필수 선행이다(시댄스 1-way 주입 재료와 같은 위계).
      - name: Reference images
        if: inputs.refimage != 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REFGEN_PREFIX: sb_out   # R2 키 접두(k_refgen env 계약) — k 레인 키공간과 분리
          REFGEN_ASPECT: '9:16'   # 콘티 기본 = 숏폼 세로(SB_DEF 비율 9:16 · k 레인 16:9와 분리)
          IN_ID: ${{ inputs.id }}
        run: |
          [ -n "$GEMINI_API_KEY" ] || { echo "::warning::GEMINI_API_KEY 미등록 — 레퍼런스 생략"; exit 0; }
          MD="viewer/sb_out/${IN_ID}/board.md"
          [ -s "$MD" ] || { echo "::warning::board.md 없음 — 레퍼런스 생략"; exit 0; }
          if [ -s "viewer/sb_out/${IN_ID}/ref.json" ]; then
            echo "레퍼런스: 물려받은 것 그대로 씀(다시 굽지 않는다 — 값 0 · 첫 장면 동일)"; exit 0
          fi
          pip install --quiet requests pillow || { echo "::warning::deps 설치 실패 — 생략"; exit 0; }
          python3 .github/scripts/k_refgen.py "$MD" "viewer/sb_out/${IN_ID}" || echo "::warning::레퍼런스 생성 실패(비치명)"

      # 🎞 모션그래픽 렌더 = 촬영=motion 전용 후속 스텝(운영자 260731 — 실사 생성 AI가 아닌 3번째 레인).
      #    board.md 「## 🎞 모션 스펙」 json → Chromium 헤드리스 프레임 캡처 → ffmpeg → sb_out/<id>/motion.mp4.
      #    외부 API 0 = 크레딧 0(Actions 분만 소모) · 디자인 값은 viewer/index.html :root 계승(창작 0).
      #    fail-soft(rc=0 · 콘티 md는 이미 정상) — 단 결과 집계 1줄은 mg_render.py가 항상 stdout에 찍는다(CLAUDE.md [관측]).
      - name: Playwright 브라우저 캐시
        if: inputs.shoot == 'motion' && inputs.story == '' && inputs.base != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: nomute-pw-chromium-v1

      - name: Motion render
        if: inputs.shoot == 'motion' && inputs.story == '' && inputs.base != ''
        uses: ./.github/actions/runner-setup
        with:
          setup: apps/mg/setup.sh
          apt: fonts-noto-cjk ffmpeg

      - name: Motion render — run
        if: inputs.shoot == 'motion' && inputs.story == '' && inputs.base != ''
        env:
          IN_ID: ${{ inputs.id }}
        run: |
          MD="viewer/sb_out/${IN_ID}/board.md"
          if [ ! -s "$MD" ]; then
            echo "모션 렌더: 씬 0/0 · 레이어 0/0 · 프레임 0장 — 미시도(board.md 없음)"   # 무성 스킵 금지(계측 문법 = mg_render.py와 동일)
            echo "::warning::board.md 없음 — 모션 렌더 생략"; exit 0
          fi
          python3 .github/scripts/mg_render.py "$MD" "viewer/sb_out/${IN_ID}"

      # 🎬 콘티 시트 = board.md 를 **한 장짜리 시트 그림**으로(운영자 260811 「시트 뽑는 스킬있으면 붙여줘」).
      #    엔진 = GPT Image(storyboard-v1 스킬 §호출 스펙 규격 계승) — 시트엔 글자가 서른 줄 넘게
      #    들어가서 화면 안 글자 축이 관건이고, 그 스킬이 이미 GPT Image 기준으로 규격화해 뒀다.
      #    fail-soft(rc=0) = 시트가 실패해도 콘티·레퍼런스·영상은 그대로 간다.
      - name: Storyboard sheet
        if: inputs.shoot == 'grok' || startsWith(inputs.shoot, 'seedance')
        env:
          IN_ID: ${{ inputs.id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # 1순위(스킬 규격) — 미등록이면 아래 제미나이로 내려앉는다
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 2순위 폴백 · 260811 실측에서 OPENAI 키가 없어 시트가 0장이었다
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REFGEN_PREFIX: sb_out
        run: |
          MD="viewer/sb_out/${IN_ID}/board.md"
          if [ ! -s "$MD" ]; then
            echo "콘티 시트: 미시도(board.md 없음)"; exit 0
          fi
          if [ -s "viewer/sb_out/${IN_ID}/sheet.json" ]; then
            echo "콘티 시트: 물려받은 것 그대로 씀(다시 굽지 않는다 — 값 0)"; exit 0
          fi
          pip install --quiet requests pillow || { echo "::warning::deps 설치 실패 — 생략"; exit 0; }
          python3 .github/scripts/sb_sheet.py "$MD" "viewer/sb_out/${IN_ID}"

      # 🎬 그록 영상 = 촬영=grok 전용 후속 스텝(운영자 260811 — 「제미나이가 그린거로 감독이
      #    프롬프팅해서 영상 뽑는다」). 컷마다 [Gemini 그림 → 그 그림을 첫 장면으로 그록 영상].
      #    ⚠ 자격 = 종량제 키가 아니라 **구독 OAuth**(XAI_REFRESH_TOKEN) = 추가 과금 0.
      #    ⚠ 컷 길이는 콘티가 적은 `0~2s` 를 그대로 쓴다(고정값 아님 — grok_sb_video.py 머리 주석).
      #    fail-soft(rc=0) = 영상이 죽어도 콘티·레퍼런스 산출은 그대로 살아야 한다.
      - name: Grok video
        # 🎬 **촬영은 2차에서만 돈다**(운영자 260813 「생성 버튼은 총 2번 — 콘티 보고 모델 골라 제작」).
        #   ⚠ 구판은 1차 전송에서도 영상까지 쐈다 — 콘티를 보기도 전에 값이 나갔다(30초면 195 크레딧).
        #     운영자가 정한 순서의 앞쪽 절반이 배선에서 통째로 빠져 있던 것이다.
        #   ⚠ 표식은 **이미 있는 값으로 읽는다**(손입력 칸 10/10 소진 = 새 칸을 못 만든다):
        #     이야기가 있으면 1차(감독) · 이야기가 비고 기준 콘티가 있으면 2차(촬영).
        #     같은 술어를 「콘티 재사용」 스텝이 이미 쓰고 있다(자 두 벌 금지).
        if: inputs.shoot == 'grok' && inputs.story == '' && inputs.base != ''
        env:
          IN_ID: ${{ inputs.id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_REFRESH_TOKEN: ${{ secrets.XAI_REFRESH_TOKEN }}
          XAI_TOKEN_STORE: ${{ runner.temp }}/grok_token.json
          # ⚠ 갱신 열쇠는 **한 번 쓰면 새것으로 바뀌고 옛것이 죽는다**. 러너는 끝나면 사라지므로
          #   새 열쇠를 비밀값에 되써 넣지 않으면 다음 발사가 「Refresh token has been revoked」로
          #   죽는다(260811 실사고 · 런 31545525981). 깃허브 기본 토큰에는 비밀값 쓰기 권한이
          #   아예 없어서 별도 개인 토큰이 필요하다 — 미등록이면 러너가 사유를 찍고 넘어간다.
          XAI_SECRET_PAT: ${{ secrets.GH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REFGEN_PREFIX: sb_out
          GROK_SOUND: ${{ inputs.sound }}
          # 배선 확인용 = 1 로 두면 1컷만 굽는다(값 최소로 자격·되쓰기·원장 전 층을 실제로 통과시킨다).
          # 빈값이면 러너 기본값(12)이 그대로 산다 = 종전 동작 무회귀.
          GROK_SB_CUT_MAX: ${{ inputs.cutmax }}
        run: |
          MD="viewer/sb_out/${IN_ID}/board.md"
          if [ ! -s "$MD" ]; then
            echo "그록 영상: 0/0컷 — 미시도(board.md 없음)"   # 무성 스킵 금지(계측 문법 = motion 레인 동문)
            echo "::warning::board.md 없음 — 그록 영상 생략"; exit 0
          fi
          [ -n "$XAI_REFRESH_TOKEN" ] || { echo "그록 영상: 0/0컷 — 미시도(XAI_REFRESH_TOKEN 미등록)"; echo "::warning::그록 자격 미등록 — 영상 생략"; exit 0; }
          # pynacl = 비밀값 봉인(깃허브가 요구하는 libsodium sealed box) — 없으면 되쓰기만 생략되고 영상은 그대로 간다
          pip install --quiet requests pillow pynacl || { echo "::warning::deps 설치 실패 — 생략"; exit 0; }
          # ⚠ ffmpeg = **러너 기본 이미지에 없다**(260812 실측 = `[Errno 2] No such file or directory: 'ffmpeg'`
          #   → 3편이 다 나왔는데 완본 이어붙이기만 조용히 걸렀다). 소리 끄기(산출 트랙 제거)도 같은 도구를
          #   쓰므로 없으면 **꺼달라고 했는데 소리가 실린 채 나간다** = 더 비싼 쪽. 그래서 여기서 깐다.
          command -v ffmpeg >/dev/null 2>&1 || sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 \
            || echo "::warning::ffmpeg 설치 실패 — 완본 이어붙이기·소리 끄기 생략(조각은 그대로 나온다)"
          python3 .github/scripts/grok_sb_video.py "$MD" "viewer/sb_out/${IN_ID}"

      # 🎬 시댄스 영상 = 촬영=seedance* 전용 후속 스텝. 러너 코드는 그록과 **같은 파일**이고
      #    통로만 갈아 끼운다(SB_LANE) — 벤더 결합이 통로 뒤에 모여 있어서 가능한 것.
      #    ⚠ 자격 = 힉스필드 구독 연결(HIGGSFIELD_REFRESH_TOKEN = `프로그램번호:갱신열쇠` 한 줄).
      #    ⚠ 프리셋 = 촬영 칸이 정한다(seedance = 2.5 720p 30초 한 발 · seedance20 = 2.0 720p 15초 두 발).
      #    ⚠ **값이 실제로 나가는 레인이다**(그록은 구독 정액 · 이쪽은 크레딧 차감) → 견적 상한을
      #      걸어 둔다. 상한을 넘으면 발사하지 않고 사유를 찍고 끝낸다.
      #    fail-soft(rc=0) = 영상이 죽어도 콘티·레퍼런스 산출은 그대로 살아야 한다.
      - name: Seedance video
        # 🎬 **촬영은 2차에서만 돈다**(운영자 260813 「생성 버튼은 총 2번 — 콘티 보고 모델 골라 제작」).
        #   ⚠ 구판은 1차 전송에서도 영상까지 쐈다 — 콘티를 보기도 전에 값이 나갔다(30초면 195 크레딧).
        #     운영자가 정한 순서의 앞쪽 절반이 배선에서 통째로 빠져 있던 것이다.
        #   ⚠ 표식은 **이미 있는 값으로 읽는다**(손입력 칸 10/10 소진 = 새 칸을 못 만든다):
        #     이야기가 있으면 1차(감독) · 이야기가 비고 기준 콘티가 있으면 2차(촬영).
        #     같은 술어를 「콘티 재사용」 스텝이 이미 쓰고 있다(자 두 벌 금지).
        if: startsWith(inputs.shoot, 'seedance') && inputs.story == '' && inputs.base != ''
        env:
          IN_ID: ${{ inputs.id }}
          SB_LANE: seedance
          SD_PRESET: ${{ inputs.shoot == 'seedance20' && 'B' || 'A' }}
          # 쪼개기 판 = 같은 2.5 를 짧은 발 여러 개로. 초당 과금이라 총액은 한 발과 같다
          # (5초 견적 32.5 = 30초 견적 195 ÷ 6 · 260813 실측 = 호출당 수수료 0).
          SD_SHOT_SEC: ${{ inputs.shoot == 'seedance5' && '5' || '' }}
          # 화면에서 고른 화질이 여기까지 와야 실제로 그 화질로 나간다 — 이 줄이 없으면
          # 고른 값과 나온 값이 갈리고 그 사실이 어디에도 안 뜬다(260813 실측 봉합).
          SD_RES: ${{ inputs.res }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HIGGSFIELD_REFRESH_TOKEN: ${{ secrets.HIGGSFIELD_REFRESH_TOKEN }}
          # 갱신 열쇠가 회전형이면 새 열쇠를 비밀값에 되써 넣어야 다음 발사가 산다(그록 레인과 같은
          # 개인 토큰 재사용 — 깃허브 자격이라 벤더 무관 · 미등록이면 사유를 찍고 넘어간다).
          XAI_SECRET_PAT: ${{ secrets.GH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REFGEN_PREFIX: sb_out
          GROK_SOUND: ${{ inputs.sound }}
          GROK_SB_CUT_MAX: ${{ inputs.cutmax }}
          # 견적 상한(크레딧) — 넘으면 발사 0. 30초 기준 실측 = 2.5 195 · 2.0 FHD 270.
          SB_COST_CAP: ${{ vars.SB_COST_CAP || '400' }}
          # 기다리기 상한 — **잡 시간 벽보다 넉넉히 작게**. 크면 폴이 끝나기 전에 잡이 잘려
          # 작업 번호도 산출도 없이 값만 나간다(260813 실사고가 정확히 그 모양).
          SD_POLL_MAX_SEC: '3000'
        run: |
          MD="viewer/sb_out/${IN_ID}/board.md"
          if [ ! -s "$MD" ]; then
            echo "시댄스 영상: 0/0편 — 미시도(board.md 없음)"   # 무성 스킵 금지(계측 문법)
            echo "::warning::board.md 없음 — 시댄스 영상 생략"; exit 0
          fi
          [ -n "$HIGGSFIELD_REFRESH_TOKEN" ] || {
            echo "시댄스 영상: 0/0편 — 미시도(HIGGSFIELD_REFRESH_TOKEN 미등록)"
            echo "::warning::시댄스 자격 미등록 — 판정기(노뮤트_힉스필드자격_확인.bat)를 돌려 넣어라"; exit 0
          }
          pip install --quiet requests pillow pynacl || { echo "::warning::deps 설치 실패 — 생략"; exit 0; }
          # ffmpeg = 러너 기본 이미지에 없다(완본 이어붙이기·소리 끄기가 조용히 걸린다 = 260812 실측)
          command -v ffmpeg >/dev/null 2>&1 || sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 \
            || echo "::warning::ffmpeg 설치 실패 — 완본 이어붙이기·소리 끄기 생략(조각은 그대로 나온다)"
          python3 .github/scripts/grok_sb_video.py "$MD" "viewer/sb_out/${IN_ID}"

      - name: Commit output
        if: always()
        env:
          IN_ID: ${{ inputs.id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "nomute-bot"
          git config user.email "bot@nomute.local"
          git add "viewer/sb_out/${IN_ID}" 2>/dev/null || true
          git add messages 2>/dev/null || true   # 영상 실패 알림(grok_sb_video.notify → shared/msg.py) 동반 커밋 — 경로를 못박는다(무경로 `git add -A` = sparse cone 밖 삭제 커밋 사고)
          git add metrics 2>/dev/null || true   # 토큰 계측 shard(claude_meter) 동반 커밋 — 있을 때만
          git commit -m "sb: ${IN_ID} 콘티 출력" || { echo "커밋할 것 없음"; exit 0; }
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch --deepen=100 origin main 2>/dev/null || true   # 얕은 클론(fetch-depth:1) 짝 — 원격 새 커밋과 로컬 HEAD 사이가 끊겨 merge-base를 못 찾으면 아래 rebase가 통째로 실패한다(= 산출 유실). main 100커밋만이라 수 초 · 실패해도 무해(260810)
            if git fetch origin "$BRANCH" && git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true; sleep $((i*3))
          done
          [ "$pushed" = 1 ] || { echo "::error::push ${BRANCH} 5회 실패 — 출력 유실"; exit 1; }
