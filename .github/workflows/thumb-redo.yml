name: thumb-redo
# 뷰어 썸네일 '다시 만들기'(functions/api/thumbredo.js) → 단일 기사 AI 썸네일 재생성.
# THUMB_ONLY=stem (+ THUMB_REDO_SID=화풍 1개면 그 화풍만) → thumb_gen 재생성(검색 og:image·타화풍 보존).
# ⚠️ 유료(Gemini) · 게이트 없음(운영자 260620 — 암호게이트는 추후 앱 전체 일괄). news-analyze thumb_gen 잡 계승.
on:
  workflow_dispatch:
    inputs:
      article:
        description: 'queue stem (with or without .md)'
        required: true
      sid:
        description: '화풍 sid 1개만 재생성(photo/webtoon/watercolor/cartoon · 4화풍 260908 복귀 · 수정 파생은 photo_r2 형식). 비우면 전체 4화풍 + 검색이미지 재생성 = Gemini 4장 과금. (폐지 sid: photo_close — 전달 시 기존 gen.json에서 제거만 되고 재생성 안 됨)'
        required: false
        default: ''
      wish:
        description: '재생성 지시(자연어·선택). 프롬프트에 얹어 반영. 비우면 기존 프롬프트로 재추첨.'
        required: false
        default: ''
      dry:
        description: "1 = 프롬프트 4종만 산출(Gemini 0 · cards/<stem>/thumbs/prompts.json 갱신 · 뷰어 「프롬프트」 패널 · 운영자 260908 Q1680). 비우면 종전 재생성."
        required: false
        default: ''
      gate:
        description: '품질 게이트 카나리아(1=THUMB_GATE 점화 — 단색 밴드 검출 시 1회 재생성 · 기본 꺼짐 · §📰 카나리아 절차)'
        required: false
        default: ''
      ref:
        description: '참조 체이닝 카나리아(1=THUMB_REF 점화 — 극화·수채화에 대표 실사진 첨부해 실제 얼굴 재현 · 기본 꺼짐)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: thumb-make            # thumb_gen(news-analyze)와 동일 그룹 = cards/ 쓰기 직렬화(경합 방지)
  cancel-in-progress: false

jobs:
  redo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1   # 최신 1커밋만 — 구 0은 원격 브랜치 567개 전체 히스토리를 받아 실측 105s를 먹었다(260810 · imggen run 30972520521 = 체크아웃 108s 중 워킹트리 쓰기는 3s뿐)
          # ⚡ 260810 sparse-checkout(scrape 카나리아 실증 = 같은 잡 A/B 20s→9s · 삭제 커밋 0건) — 목록 = 이 잡이 실행줄에서 여는 폴더뿐.
          #   빠지는 대형 = _versions 437M · docs 90M · 자료 75M · _산출 74M(어느 잡도 안 연다) · ⚠ git add/rm 대상은 전건 포함 검문 통과분.
          sparse-checkout: |
            .github
            shared
            scraper
            cards
            queue           # ⚠ 260908 실사고 봉합 — thumb_gen 은 queue/<stem>.md 를 읽는다. 260810 다이어트가 이 폴더를 빠뜨려 「다시 만들기」가
            apps/k/library  #   "THUMB_ONLY 대상 없음"으로 조용히 no-op(rc 0 · 변경 없음 · 08-20 run 32346083119 실측). 라이브러리 = 연출 코드 조회 원천.
          ref: main
      - name: AI 썸네일 재생성 (단일 기사 · THUMB_ONLY · sid면 그 화풍만)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ARTICLE: ${{ inputs.article }}
          SID: ${{ inputs.sid }}
          WISH: ${{ inputs.wish }}
          THUMB_GATE: ${{ inputs.gate }}
          THUMB_REF: ${{ inputs.ref }}
          DRY: ${{ inputs.dry }}
        run: |
          if [ "${DRY}" = "1" ]; then   # 프롬프트 4종만(운영자 260908 Q1680) — 키·Pillow·R2 불요 · Gemini 0 · 결정론 합성기(compose_all)
            STEM="${ARTICLE%.md}"
            echo "프롬프트 산출 대상: ${STEM}"
            python3 .github/scripts/thumb_gen.py --dry "queue/${STEM}.md" --json "cards/${STEM}/thumbs/prompts.json" || echo "::warning::프롬프트 산출 실패"
            exit 0
          fi
          [ -n "${GEMINI_API_KEY}" ] || { echo "GEMINI_API_KEY 미설정 — 생략"; exit 0; }
          # Pillow = 로고필터(_is_logo_card)·게이트(_band_fail) 픽셀 판독용 — 없으면 둘 다 조용히 no-op이라 명시 설치(검증4).
          pip install --quiet Pillow 2>/dev/null || echo "Pillow 설치 실패(픽셀 판독 없이 진행 · fail-soft)"
          export THUMB_ONLY="${ARTICLE%.md}"
          export THUMB_REDO_SID="${SID}"
          export THUMB_REDO_WISH="${WISH}"   # 자연어 재생성 지시(선택) → thumb_gen이 프롬프트에 얹음(셸 비보간 = 인젝션 안전)
          # ⚠️ WISH의 개행·제어문자는 thumbredo.js가 제거(load-bearing) → 아래 echo가 ::workflow-command:: 를 못 만든다(워크플로커맨드 인젝션 차단·평의회 보안)
          echo "재생성 대상: ${THUMB_ONLY} ${SID:+(화풍 ${SID})}${WISH:+ · 지시: ${WISH}}"
          python3 .github/scripts/thumb_gen.py || echo "::warning::재생성 일부 실패"
      - name: Commit
        if: always()
        env:
          ARTICLE: ${{ inputs.article }}
          SID: ${{ inputs.sid }}
          DRY: ${{ inputs.dry }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards 2>/dev/null || true
          git add scraper/thumb_wishes.jsonl 2>/dev/null || true   # wish 원장(운영자 재생성 지시 적립 · TH-07 260703)
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          if [ "${DRY}" = "1" ]; then MSG="thumbs: 프롬프트 4종 ${ARTICLE%.md}"; else MSG="thumbs: 재생성 ${ARTICLE%.md} ${SID:+(${SID})}"; fi
          git commit -m "${MSG}"
          for i in 1 2 3 4; do
            git fetch --deepen=100 origin main 2>/dev/null || true   # 얕은 클론(fetch-depth:1) 짝 — 원격 새 커밋과 로컬 HEAD 사이가 끊겨 merge-base를 못 찾으면 아래 rebase가 통째로 실패한다(= 산출 유실). main 100커밋만이라 수 초 · 실패해도 무해(260810)
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          # ⚠ 260816 봉합 — 구판은 warning 만 남기고 rc 0(초록)으로 끝났다. 이 축은 산출이 과금분이고
          #   발사가 일회성이라 자동 재시도가 0이라서, 조용히 끝나면 썸네일 수정 결과이 그대로 유실되고
          #   화면은 「제작중」에 멈춘다(그림 자체는 R2 에 살지만 완료 신호·이력이 사라진다).
          echo "::error::push 실패 — 썸네일 수정 결과 미착지"; exit 1
      - name: Cloudflare 즉시 재빌드
        if: always()
        env:
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          [ -n "${CF_DEPLOY_HOOK}" ] || { echo "CF_DEPLOY_HOOK 미설정 — 즉시 재빌드 생략"; exit 0; }
          curl -fsS -X POST "${CF_DEPLOY_HOOK}" >/dev/null && echo "재빌드 트리거" || echo "재빌드 트리거 실패(무시)"
