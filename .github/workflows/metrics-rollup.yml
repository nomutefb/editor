name: metrics-rollup

# 토큰 사용량 롤업 — claude_meter 가 잡마다 남긴 shard(metrics/usage/*.jsonl)를 10분 버킷으로 집계해
#   viewer/token-usage.json(뷰어 tokens.html 이 fetch)로 굽고, 오래된 shard(>3h)는 원장(metrics/token-usage.jsonl)으로 접어 삭제(레포 비대 방지).
# LLM·제미나이 0(파이썬만) = 토큰 과금 0·무료. 변동 없으면 커밋 생략(불필요 Pages 재빌드 차단).
# ⚠️ 빈도는 2시간(추적용엔 충분). 더 자주 필요하면 수동(workflow_dispatch) 또는 cron 조정.
on:
  schedule:
    - cron: '7 */2 * * *'   # 2시간마다(분 7 = 정시 혼잡 회피)
  workflow_dispatch:

concurrency:
  group: metrics-rollup
  cancel-in-progress: false

permissions:
  contents: write

env:
  PAGES_COALESCE: ${{ vars.PAGES_COALESCE }}   # [CF-Pages-Skip] 코얼레싱 킬스위치(0=off · 부재=ON) — 정본 = git_land.sh 헤더 · Q1331
jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1   # 최신 1커밋만 — 구 0은 원격 브랜치 567개 전체 히스토리를 받아 실측 105s를 먹었다(260810 · imggen run 30972520521 = 체크아웃 108s 중 워킹트리 쓰기는 3s뿐)
          # ⚡ 260810 sparse-checkout(scrape 카나리아 실증 = 같은 잡 A/B 20s→9s · 삭제 커밋 0건) — 목록 = 이 잡이 실행줄에서 여는 폴더뿐.
          #   빠지는 대형 = _versions 437M · docs 90M · 자료 75M · _산출 74M(어느 잡도 안 연다) · ⚠ git add/rm 대상은 전건 포함 검문 통과분.
          sparse-checkout: |
            .github
            shared
            metrics
            viewer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Roll up token usage (10분 버킷 집계 + 오래된 shard 접기)
        run: |
          mkdir -p metrics/usage
          python3 shared/token_report.py --prune 3 --write viewer/token-usage.json --quiet
          python3 shared/paid_ledger.py --write metrics/paid-usage.json || true   # 종량제(Gemini 등) 일 합산 원장(평의회 260812 권고6 · LLM 0·네트워크 0 — 산출물 원장 4종 합산 = 토큰 지도 ③표 「산정」→실측 · 실패 무해)
          echo "--- 최근 표 ---"
          python3 shared/token_report.py --hours 24 || true

      - name: Commit (변동 시만)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in viewer/token-usage.json metrics; do if [ -e "$f" ]; then git add "$f"; fi; done   # 파일별 개별 add(Q980 전파: 결측 pathspec 1개 = add 전체 원자 abort 무음)
          if git diff --cached --quiet; then echo "변동 없음 — 커밋 생략"; exit 0; fi
          PFX=""; [ "${PAGES_COALESCE:-1}" != "0" ] && PFX="[CF-Pages-Skip] "   # CF 빌드만 스킵(코얼레싱 · 정본 = git_land.sh 헤더 · Q1331 — GitHub 발화 무손상 토큰)
          git commit -m "${PFX}metrics: 토큰 사용량 롤업(10분 버킷)"
          for i in 1 2 3 4; do
            git fetch --deepen=100 origin main 2>/dev/null || true   # 얕은 클론(fetch-depth:1) 짝 — 원격 새 커밋과 로컬 HEAD 사이가 끊겨 merge-base를 못 찾으면 아래 rebase가 통째로 실패한다(= 산출 유실). main 100커밋만이라 수 초 · 실패해도 무해(260810)
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((2**i))
          done
          echo "::warning::롤업 push 실패(다음 회차 재시도)"
