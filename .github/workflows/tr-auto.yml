name: tr-auto

# 번역카드 자동 마커 번역(Pages Function /api/tr 발사) — OCR 라인 입력으로 claude -p(강조 선정+한글 번역)
#   → viewer/tr_out/<id>/plan.json 커밋(tr.html이 폴링해 형광펜+칩 오버레이 합성).
# 골격 = k-make.yml 그대로(구독 OAuth·4계정 폴오버·커밋 가드 — 운영자 260720 Q274 자동 엔진).
# (260810) 원본 사진이 R2로 러너에 온다 = 모델이 **이미지를 직접 읽는다**(OCR = 좌표 앵커 전담) · 좌표는 여전히 브라우저 보관.
on:
  workflow_dispatch:
    inputs:
      id:
        description: '출력 id(타임스탬프)'
        type: string
      lines:
        description: 'OCR 라인 JSON [{i,t}]'
        type: string
      ctx:
        description: '컨텍스트 JSON {art:{t,m,b},note,redo} — 참고 기사 스탠스·재생성 지시(운영자 260721 v2 · 옵션)'
        type: string
        default: ''
      imgkey:
        description: 'R2 원본 사진 키(up_src/<id>.jpg · 모델이 직접 보는 소스 — 운영자 260810 · 빈값=텍스트 전용 종전 경로)'
        type: string
        default: ''
      account:
        description: '이 실행에 쓸 계정(구독 OAuth)'
        type: choice
        default: MUTENO
        options:
          - NOMUTEFB
          - MUTENO
          - EMS1130G

concurrency:
  group: tr-auto-${{ inputs.id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1   # 최신 1커밋만 — 구 0은 원격 브랜치 567개 전체 히스토리를 받아 실측 105s를 먹었다(260810 · imggen run 30972520521 = 체크아웃 108s 중 워킹트리 쓰기는 3s뿐)
          # ⚡ 260810 sparse-checkout(scrape 카나리아 실증 = 같은 잡 A/B 20s→9s · 삭제 커밋 0건) — 목록 = 이 잡이 실행줄에서 여는 폴더뿐.
          #   빠지는 대형 = _versions 437M · docs 90M · 자료 75M · _산출 74M(어느 잡도 안 연다) · ⚠ git add/rm 대상은 전건 포함 검문 통과분.
          #   ⚠ prompts 는 「실행줄에서 여는 폴더」가 아니라 **스크립트가 여는 폴더**라 260810 목록에서
          #     빠졌다. trauto.sh 는 prompts/tr-auto.md 를 읽는다(sb-make 실측 동형).
          sparse-checkout: |
            .github
            shared
            metrics
            viewer
            prompts

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install claude-code
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch source photo (R2)
        if: inputs.imgkey != ''
        env:
          R2_SRC: ${{ inputs.imgkey }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # 정본 = edit-make.yml 「R2 직업로드 소스 받기」 스텝 문법 그대로(키 재검증 → aws s3 cp) · 확장자만 이 파이프 셋(jpg).
          # ⚠ fail-soft = 못 받아도 잡을 죽이지 않는다(다음 스텝이 파일 유무로 분기 = 텍스트 전용 종전 경로).
          printf '%s' "$R2_SRC" | grep -Eqx 'up_src/[0-9]{12}-[a-f0-9]{6}\.jpg' \
            || { echo "::warning::imgkey 형식 밖 — 사진 없이 진행"; exit 0; }
          [ -n "${R2_BUCKET:-}" ] && [ -n "${R2_ACCOUNT_ID:-}" ] \
            || { echo "::warning::R2 미설정 — 사진 없이 진행"; exit 0; }
          aws s3 cp "s3://$R2_BUCKET/$R2_SRC" "/tmp/tr_src.jpg" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors \
            || { echo "::warning::R2 내려받기 실패 — 사진 없이 진행"; rm -f /tmp/tr_src.jpg; exit 0; }
          ls -l /tmp/tr_src.jpg

      - name: Make tr plan
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO')] }}
          CLAUDE_CODE_OAUTH_TOKEN_ALT: ${{ (inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO') == 'NOMUTEFB' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_NOMUTEFB }}   # 서브1 폴오버(k-make 동일 체인)
          CLAUDE_CODE_OAUTH_TOKEN_ALT2: ${{ (inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO') == 'MUTENO' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENO }}   # 서브2 폴오버
          CLAUDE_CODE_OAUTH_TOKEN_ALT3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130M }}   # 서브3 폴오버(체인 실꼬리)
          ACTIVE_ACCOUNT: ${{ inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO' }}
          LINES: ${{ inputs.lines }}
          CTX: ${{ inputs.ctx }}
          IN_ID: ${{ inputs.id }}
          TR_SRC_IMG: /tmp/tr_src.jpg   # 위 스텝 산출(없으면 파일 부재 = trauto.sh가 텍스트 전용으로 분기)
        run: |
          [ -n "$IN_ID" ] || { echo "::error::id 없음"; exit 1; }
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN_<계정> 시크릿이 비어있음"; exit 1
          fi
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          bash .github/scripts/trauto.sh "$IN_ID"

      - name: Commit output
        if: always()
        env:
          IN_ID: ${{ inputs.id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "nomute-bot"
          git config user.email "bot@nomute.local"
          git add "viewer/tr_out/${IN_ID}" 2>/dev/null || true
          git add metrics 2>/dev/null || true   # 토큰 계측 shard 동반 커밋 — 있을 때만
          git commit -m "tr: ${IN_ID} 번역 플랜 출력" || { echo "커밋할 것 없음"; exit 0; }
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch --deepen=100 origin main 2>/dev/null || true   # 얕은 클론(fetch-depth:1) 짝 — 원격 새 커밋과 로컬 HEAD 사이가 끊겨 merge-base를 못 찾으면 아래 rebase가 통째로 실패한다(= 산출 유실). main 100커밋만이라 수 초 · 실패해도 무해(260810)
            if git fetch origin "$BRANCH" && git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true; sleep $((i*3))
          done
          [ "$pushed" = 1 ] || { echo "::error::push ${BRANCH} 5회 실패 — 출력 유실"; exit 1; }
