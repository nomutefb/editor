name: imggen

# 뷰어 '이미지 생성'(검색 카러셀 + 버튼 팝업 · functions/api/genimg.js 디스패치) —
# Claude(Fable 5·effort high·구독 OAuth·폴오버 SSOT · 운영자 260721 — 실패 시 Opus 5 1회 폴백)가 기사 요약·시사점+운영자 버튼 옵션(화풍·비율·해상도·문구·주문)으로
# Gemini 이미지 프롬프트를 작성 → Gemini(종량제 GEMINI_API_KEY)가 렌더 → R2 → cards/<stem>/thumbs/search.json 앞쪽
# prepend(label '생성') → push마다 build-viewer 재실행 → 뷰어 카러셀 반영.
# 운영 원칙(운영자 260707) = 구독+종량제 병행 활용: 프롬프트 지능=구독 Claude · 렌더=종량제 Gemini.
# 카드 제미나이 0 불변과 무관 — 이 경로는 뷰어 수동 발사(슛과 동일 정책·자동 파이프라인 아님).
on:
  workflow_dispatch:
    inputs:
      stem:
        description: '기사 file 베이스(queue/<stem>.md · cards/<stem>)'
        required: true
        type: string
      opts:
        description: '옵션 JSON {style,sub,aspect(N:N자유),size(720p·FHD·2K·4K),count,fmt(png·jpg90),mood(auto·axes+moodAx),kweb,textOn,wish · 레거시 text/font/1K 수용} — genimg.js가 화이트리스트 검증 후 전달(260710 개요 개편)'
        default: '{}'
        type: string
      free:
        description: "자유 생성(기사 무관 · 이미지 제작 도구 /6 생성 탭) — '1'=viewer/gen_out/free.json 적재(stem 무시·'free' 더미)"
        default: '0'
        type: string
      account:
        description: '구독 OAuth 계정'
        type: choice
        default: MUTENO
        options:
          - NOMUTEFB
          - MUTENO
          - EMS1130G

concurrency:
  group: imggen-${{ github.event.inputs.stem }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1   # main 최신 1커밋만 — 구 0(전체 히스토리 + 원격 브랜치 전량)은 실측 105초를 먹었다(260810 · run 30972520521 = 체크아웃 108s 중 워킹트리 쓰기는 3s뿐, 나머지는 브랜치 567개 히스토리 수신).
          # ⚠ rebase 여유는 아래 Commit 스텝의 --deepen이 담당(shallow 경계와 원격 새 커밋이 안 이어지면 merge-base 실종 = rebase 실패 → 산출 유실).
          # ⚡ 260810 sparse-checkout(scrape 카나리아 실증 = 같은 잡 A/B 20s→9s · 삭제 커밋 0건) — 목록 = 이 잡이 실행줄에서 여는 폴더뿐.
          #   빠지는 대형 = _versions 437M · docs 90M · 자료 75M · _산출 74M(어느 잡도 안 연다) · ⚠ git add/rm 대상은 전건 포함 검문 통과분.
          # ⚠ metrics = 260812 실사고 봉합. Commit 스텝이 `for f in cards metrics viewer/gen_out`로 metrics를 add하는데
          #   이 목록에만 빠져 있었다(260810 sparse 전환 누락) → git이 "sparse 정의 밖"이라 거부 → `bash -e`가 그 자리에서
          #   죽어 **렌더는 성공했는데 산출이 main에 안 실린다**(run 31551908916 = 이미지 R2 업로드 완료 · free.json 미반영
          #   = 뷰어 카러셀에서 영영 안 보임). 증상이 「생성했는데 목록에 없음」뿐이라 운영자 눈이 유일한 검출기였다.
          #   형제 28개 워크플로 전수 대조 = 실제 경로 누락은 이 파일 단독(같은 병의 형제 0).
          #   ⚠ 목록 줄에 인라인 주석 금지 — 각 줄이 그대로 sparse 패턴이 된다.
          sparse-checkout: |
            .github
            shared
            cards
            queue
            viewer
            metrics

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code   # 러너엔 claude 미설치(없으면 exit 127)

      - name: Deps (pillow — 후처리 · pywebpush — 실패 알림)
        continue-on-error: true   # 설치 실패해도 잡 지속 — gen_image.post_process가 PIL 부재 시 원본 PNG 유지(fail-soft) · pywebpush 부재는 push_send가 "미설치 — 생략"으로 자체 fail-soft
        run: |
          timeout 120 python3 -m pip install --quiet pillow || { sleep 3; timeout 120 python3 -m pip install --quiet pillow; }   # §인프라 네트워크 op 타임아웃(+1 재시도) — 커스텀 비율 크롭·해상도 스냅·JPG 인코딩용 · python3 -m pip = 실행 인터프리터 일치(6인 검증)
          timeout 120 python3 -m pip install --quiet pywebpush || echo "::warning::pywebpush 미설치 — 생성 실패 알림 생략"   # 렌더 전건 실패 시 웹푸시(운영자 260730 Q01) · conv-make 등 형제 워크플로 동일 설치 문법

      - name: Generate images
        env:
          # 인증 = 구독 OAuth(API 키 미사용) — analyze/ask와 동일 동적 계정 + 폴오버 체인(§📰 f)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', github.event.inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO')] }}
          ACTIVE_ACCOUNT: ${{ github.event.inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO' }}
          CLAUDE_CODE_OAUTH_TOKEN_ALT: ${{ (github.event.inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO') == 'NOMUTEFB' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_NOMUTEFB }}   # 서브1 폴오버(체인 MUTENO→NOMUTEFB→EMS1130G→MUTENONA)
          CLAUDE_CODE_OAUTH_TOKEN_ALT2: ${{ (github.event.inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO') == 'MUTENO' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENO }}   # 서브2 폴오버(체인 3번째)
          CLAUDE_CODE_OAUTH_TOKEN_ALT3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENONA }}   # 서브3 폴오버(체인 실꼬리 = 항상 MUTENONA)
          # 렌더 = 종량제 Gemini(운영자 의도 — 썸네일·카드 슛과 동일 키). gen_image.py가 Claude 서브프로세스 동안만 env서 제거.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # 렌더 엔진 토글 = GPT Image(운영자 260727) · 예비 계정 키는 260816 이관에서 폐지(운영자 «예비 필요없음 본 1개만») — 없으면 gen_image가 Gemini로 폴백(기능 무중단)
          OPENAI_IMG_MODEL: ${{ vars.OPENAI_IMG_MODEL }}   # 선택 — 비우면 gen_image 후보 체인(gpt-image-2 → gpt-image-1)
          # R2 = 생성 PNG 재호스팅(레포 비대 회피). 5개 다 없으면 git 폴백(cards/<stem>/thumbs 커밋 → build-viewer 복사 서빙).
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # 웹푸시 = 렌더 전건 실패(특히 제미나이 한도 소진) 즉시 알림(운영자 260730 Q01 "지금 가는 경로 있는데 거기로") — 배선 = push_send.py --notify(키워드 알림·제작완료와 동일 정본)
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          GENIMG_STEM: ${{ github.event.inputs.stem }}
          GENIMG_OPTS: ${{ github.event.inputs.opts || '{}' }}
          GENIMG_FREE: ${{ github.event.inputs.free || '0' }}
        run: |
          echo "활성 계정: ${ACTIVE_ACCOUNT} · stem=${GENIMG_STEM} · opts=${GENIMG_OPTS}"
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN_${ACTIVE_ACCOUNT} 시크릿 비어있음"; exit 1
          fi
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN GDRIVE_SA_JSON
          python3 .github/scripts/gen_image.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "nomute-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in cards metrics viewer/gen_out; do if [ -e "$f" ]; then git add "$f"; fi; done   # 파일별 개별 add(Q980 전파: 결측 pathspec 1개 = add 전체 원자 abort 무음) · gen_out = 자유 생성(free) 목록·git 폴백 PNG
          if git diff --cached --quiet; then
            echo "변경 없음(생성 이미지 0)"; exit 0
          fi
          git fetch --deepen=100 origin main 2>/dev/null || true   # shallow 경계 확장(260810 fetch-depth:1 전환 짝) — 얕은 클론은 원격 새 커밋과 로컬 HEAD 사이가 끊겨 merge-base를 못 찾으면 아래 rebase가 통째로 실패한다. main 단일 브랜치 100커밋만이라 수 초 · 실패해도 무해(구 동작 유지)
          for i in 1 2 3 4; do
            git pull --rebase --autostash -X ours origin main || echo "::warning::pull--rebase 실패(사유 = 위 로그) — 재시도 계속"
            # 자유 생성 유실 봉합(260707 실측): rebase -X ours = 원격 승 → free.json 내 신규 항목 드랍 가능
            #   → 임시본(/tmp/genimg_new.json · gen_image.py free가 기록)에서 매 재시도마다 재병합(prepend·중복 URL 제거·캡 24)
            if [ -f /tmp/genimg_new.json ]; then
              python3 -c 'import json,os;p="viewer/gen_out/free.json";new=json.load(open("/tmp/genimg_new.json"));cur=json.load(open(p,encoding="utf-8")) if os.path.exists(p) else [];urls=set(i.get("url") for i in cur);json.dump(([i for i in new if i.get("url") not in urls]+cur)[:24],open(p,"w",encoding="utf-8"),ensure_ascii=False,indent=2)'
              git add viewer/gen_out/ 2>/dev/null || true
            fi
            git commit -m "genimg: 제미나이 생성이미지 추가(버튼 프롬프트·Fable 작성)" 2>/dev/null || true
            git push origin main && exit 0 || { echo "push 재시도 $i"; sleep $((2**i)); }
          done
          echo "::warning::push 실패(재시도 소진)"
          # ⚠️ push는 moreimg과 동일하게 'origin main'만 — HEAD:main 금지(브랜치 ref로 디스패치될 경우
          #    브랜치 커밋 전체가 main에 밀려 들어가는 검토 우회 머지 사고 경로 · 이 워크플로는 main ref 전용).
