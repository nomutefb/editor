name: pick
# 뷰어 '고르기'(픽) → pending/ 적재 → news-analyze 발동. 사람-게이트 큐레이션 진입.
# scrape 의 analyze 경로(pending→analyze)를 재사용 = 기존 파이프라인·불변 무수정.
# 트리거 = Pages Function /api/pick (GH_TOKEN dispatch). 발동 비용 = Opus(구독) 분석 1건.
on:
  workflow_dispatch:
    inputs:
      url:
        description: '고른 기사 원문 url'
        type: string
        required: true
      title:
        description: '제목(로그용)'
        type: string
        default: ''
      alt:
        description: '같은 사건 다른 매체 url(cluster_members·공백구분) — 원매체 차단 시 대체 fetch'
        type: string
        default: ''
      event_key:
        description: '사건 그룹라벨(event_key) — 분석 frontmatter까지 흘려 피드 event_key 티어 활성'
        type: string
        default: ''

concurrency:
  group: pick
  cancel-in-progress: false

permissions:
  contents: write   # pending/ · seen_urls.txt 커밋
  actions: write    # news-analyze 디스패치(GITHUB_TOKEN push 는 못 깨움 → 명시 발동)

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1   # 최신 1커밋만 — 구 0은 원격 브랜치 567개 전체 히스토리를 받아 실측 105s를 먹었다(260810 · imggen run 30972520521 = 체크아웃 108s 중 워킹트리 쓰기는 3s뿐)
          # ⚡ 260810 sparse-checkout(scrape 카나리아 실증 = 같은 잡 A/B 20s→9s · 삭제 커밋 0건) — 목록 = 이 잡이 실행줄에서 여는 폴더뿐.
          #   빠지는 대형 = _versions 437M · docs 90M · 자료 75M · _산출 74M(어느 잡도 안 연다) · ⚠ git add/rm 대상은 전건 포함 검문 통과분.
          sparse-checkout: |
            .github
            shared
            scraper
            pending

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet feedparser requests

      - name: Pick → pending/ (중복 스킵)
        env:
          PICK_URL: ${{ inputs.url }}
          PICK_TITLE: ${{ inputs.title }}   # fetch 차단 매체 분석 단서(접근 가능한 다른 매체 WebSearch용)
          PICK_ALT: ${{ inputs.alt }}       # 같은 사건 다른 매체 url(원매체 차단 시 대체 fetch — item3)
          PICK_EKEY: ${{ inputs.event_key }}   # 사건 그룹라벨 → pending '# ekey:' → analyze frontmatter event_key(피드 티어 활성)
        run: python3 scraper/pick_pending.py | tee /tmp/pick.out

      # 본문 선-fetch(운영자 260727) — 픽이 방금 만든 pending(신규 파일만)에 기사 본문을 미리 긁어
      # `# body:`로 동봉 → analyze 의 모델 검색 왕복(WebFetch 턴) 축소 = 요약 단축. 폰 공유의 선-fetch
      # 동봉(analyze.sh ① embedded 경로)과 같은 규격·같은 20000B 캡. ⚠️ 900B(analyze THIN_BYTES) 미만·
      # 실패 = 동봉 안 함 — 빈약 본문을 심으면 analyze 의 대체매체 최장본문 폴백(embedded 있으면 미발동)이
      # 죽어 품질 저하. 기존 커밋된 pending 은 안 건드림(analyze 소비와 modify/delete 레이스 차단) · fail-soft.
      # ⚠️ name 은 반드시 따옴표 — 값 안의 `# body:` 가 무따옴표 스칼라면 YAML `: ` 규칙에 걸려
      #    워크플로 파일 전체가 무효(startup_failure) → workflow_dispatch 거절 = /api/pick 502(260728 실증).
      - name: "본문 선-fetch (# body: 동봉 — 분석 왕복 축소)"
        run: |
          git status --porcelain pending 2>/dev/null | awk '$1=="??"{print $2}' | while read -r f; do
            case "$f" in pending/*.txt) ;; *) continue;; esac
            grep -qm1 '^# body:' "$f" && continue
            url="$(head -n1 "$f" | tr -d '\r\n')"
            case "$url" in http*) ;; *) continue;; esac
            body="$(timeout 60 bash .github/scripts/fetch_article.sh "$url" 2>/dev/null | head -c 20000 || true)"
            blen="$(printf %s "$body" | wc -c | tr -d ' ')"
            if [ "${blen:-0}" -ge 900 ]; then
              { echo "# body:"; printf '%s\n' "$body"; } >> "$f"
              echo "선-fetch 동봉: $f (${blen}B)"
            else
              echo "선-fetch 생략(빈약/차단 ${blen:-0}B — analyze 기존 폴백 그대로): $f"
            fi
          done

      - name: Commit & trigger analyze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW="$(sed -n 's/^NEW=//p' /tmp/pick.out | tail -1)"
          if [ "${NEW:-0}" = "0" ]; then echo "신규 없음(중복/무효) — 분석 생략"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ⚠⚠ 260817 봉합 — 여기 있던 `git add`+`git commit` 두 줄이 **픽 유실의 진범**이었다.
          #   git_land 는 「워킹트리 변동」으로 착지 여부를 판정하는데(git diff --cached), 앞줄이 먼저
          #   커밋해 버리면 변동이 커밋에 흡수돼 「변동 없음 — 커밋 생략」으로 조용히 빠진다 = push 0.
          #   그러면 방금 만든 pending 파일이 러너 로컬 커밋에 갇힌 채 러너와 함께 사라지고,
          #   아래 착지 판정이 걸려 잡은 빨강인데 운영자 화면에선 「픽했더니 그냥 없어짐」으로만 보인다
          #   (실측 run 31981913235 = `create pending/260817-092415-pick-e87f.txt` 직후 「변동 없음」).
          #   → 커밋은 git_land 가 한다(그 함수의 계약) · 여기선 만들어만 둔다.
          # ⚠⚠ 260816 봉합 — 구판 `pull --rebase -X ours` 는 리베이스에서 ours = **upstream** 이라 충돌 시
          #   우리 헝크가 버려지는데 push 는 성공한다. 실측 형태는 **부분 공동화**다(신규 파일은 살고
          #   append 원장의 dedup 줄만 빠진다) → 중복 재적재·재과금.
          #   → git_land 위임 = 리베이스를 안 쓰고(꼬임 0) **남의 착지분을 BASE 대조로 복원**한다(같은 날 봉합).
          #   원장 축의 유일 무손실이 이 방식이다(`-X theirs` 는 남의 줄을 지운다 = 샌드박스 실측).
          #   PAGES_COALESCE=0 = 이 축들은 코얼레싱 금지 축이라 접두를 끈다(pc_lane `_push` 문법 사본).
          git reset -q HEAD -- . 2>/dev/null || true
          PAGES_COALESCE=0 bash .github/scripts/git_land.sh "pick: 큐레이션 1건 적재" pending scraper/seen_urls.txt
          git fetch -q origin main 2>/dev/null || true
          pushed=0; git merge-base --is-ancestor HEAD origin/main 2>/dev/null && pushed=1
          # ⚠ 260816 봉합 — 구판은 4회 다 실패해도 **경고조차 없이** 다음 줄로 떨어졌다(그 아래 exit 1 은
          #   디스패치 판정이라 착지와 무관). 그러면 운영자가 손으로 누른 픽이 통째로 사라지는데 잡은 초록이고,
          #   바로 뒤 디스패치는 그대로 돌아 **적재도 없는 분석**을 깨운다. 형제는 이미 고쳐져 있었다
          #   (breaking-judge.yml 자동픽 · scrape.yml candidates) = 이 자리만 미추종 · 문법은 그 사본.
          [ "${pushed:-0}" = 1 ] || { echo "::error::pick push 실패(재시도 소진) — 운영자 픽이 main 에 안 올라갔다"; exit 1; }
          # GITHUB_TOKEN 푸시는 news-analyze(push 트리거)를 재귀방지로 못 깨운다 → 명시 디스패치(scrape와 동일).
          ok=0; for i in 1 2 3; do
            gh workflow run news-analyze.yml && { ok=1; break; }
            echo "::warning::news-analyze 디스패치 실패 — 재시도 $i"; sleep $((i*3))
          done
          [ "$ok" = 1 ] || { echo "::error::news-analyze 디스패치 3회 실패 — pending 적재됐으나 분석 미발동(수동 실행 필요)"; exit 1; }
