name: hf-check

# 시댄스(힉스필드) 통로 자격·견적 확인 — **크레딧 0**.
#   영상도 그림도 안 만든다. 열쇠가 살아 있는지, 창구가 우리 요청을 받는지, 견적이 얼마인지만 본다.
#   ⚠ 「키만 넣으면 바로 테스트」의 그 테스트가 이것이다(설계 M3 §5-② 확인 축).
#   ⚠ 갱신 열쇠가 회전형이면 이 실행이 새 열쇠를 비밀값에 되써 넣는다 → 되쓰기용 개인 토큰 필요.

on:
  workflow_dispatch:
    inputs:
      preset:
        description: '프리셋(A = 시댄스2.5 720p 30초 · B = 시댄스2.0 1080p 15초)'
        type: choice
        options: ['A', 'B']
        default: 'A'
      ratio:
        description: '비율(쇼츠 = 9:16)'
        type: string
        default: '9:16'
      sec:
        description: '견적을 물어볼 길이(초 · 빈값 = 프리셋 기본) — 길이별로 물어보면 호출 수수료 유무가 드러난다'
        type: string
        default: ''
      res:
        description: '화질(720p·FHD·4K · 빈값 = 프리셋 기본) — 인터페이스 표기와 창구 실제가 다를 수 있어 견적으로 먼저 묻는다'
        type: string
        default: ''
      probe:
        description: '문지기를 열고 날 이름 그대로 물어본다(1 = 켜기) — 창구 목록에 없는 이름이 실은 통하는지 보는 칸. 견적만 보므로 과금 0.'
        type: string
        default: ''
      sweep:
        description: '값 곡선 훑기(1 = 켜기) — 그 판이 아는 화질 전부 × 길이 여러 개의 견적을 한 번에 물어 초당 단가와 기본요금을 낸다. 견적만이라 과금 0.'
        type: string
        default: ''

permissions:
  contents: read

# 같은 열쇠를 쓰는 판과 **한 줄로 세운다** — 확인이 촬영과 겹치면 그 순간 열쇠 사슬이 끊긴다.
concurrency:
  group: nm-seedance-key
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            shared
            .github

      - name: 시댄스 통로 확인
        env:
          HIGGSFIELD_REFRESH_TOKEN: ${{ secrets.HIGGSFIELD_REFRESH_TOKEN }}
          # 회전형이면 새 열쇠를 되써 넣는다(그록과 같은 개인 토큰 재사용 — 깃허브 자격이라 벤더 무관)
          XAI_SECRET_PAT: ${{ secrets.GH_TOKEN }}
          SD_PRESET: ${{ inputs.preset }}
          SD_RATIO: ${{ inputs.ratio }}
          SD_SHOT_SEC: ${{ inputs.sec }}
          SD_RES: ${{ inputs.res }}
          SD_RES_PROBE: ${{ inputs.probe }}
          SD_SWEEP: ${{ inputs.sweep }}
        run: |
          [ -n "$HIGGSFIELD_REFRESH_TOKEN" ] || {
            echo "시댄스 확인: 미시도(HIGGSFIELD_REFRESH_TOKEN 미등록)"   # 무성 스킵 금지(계측 문법)
            echo "::error::HIGGSFIELD_REFRESH_TOKEN 비밀값이 비어 있다 — 판정기(노뮤트_힉스필드자격_확인.bat)를 돌려 넣어라"
            exit 1
          }
          pip install --quiet pynacl || echo "::warning::pynacl 설치 실패 — 열쇠 되쓰기만 생략(확인은 그대로 간다)"
          python3 shared/lane_seedance.py
