name: sb-sheet

# 🎬 이미 있는 콘티(board.md) 하나를 **시트 그림으로만** 굽는 짧은 레인(운영자 260816 「먼저 구워서 주셈」).
#
# ⚠ 왜 따로 만들었나 = `sb-make.yml` 로는 「시트만」이 되는 조합이 없다. 이야기를 비우면
#   `Make storyboard` 가 콘티를 새로 써서 기존 board.md 를 덮고, 기준 콘티를 주면 영상 스텝까지
#   조건이 참이 되어 촬영 값이 통째로 나간다. 이미 확정된 콘티의 그림만 다시 뽑는 길이 없었다.
# ⚠ 폴더는 두 자리를 다 본다 — 정규 산출 자리(`viewer/sb_out/<id>`)에 없으면 손조립 발사 자리
#   (`sb_out/<id>`)를 쓴다. 후자는 발사에 쓰는 사진 주소가 파일 안에 박혀 있어 옮기면 깨진다.
# ⚠ 값 = 그림 두 장뿐(영상 0). 열쇠가 없으면 두 번째 그림 창구로 내려앉는다(sb_sheet.py 엔진 2단).
# ⚠ 굽는 판·프롬프트·판형 견본은 전부 `sb_sheet.py` 정본을 그대로 쓴다 = 사본 0.

on:
  workflow_dispatch:
    inputs:
      id:
        description: '콘티 폴더 이름(viewer/sb_out/<이름> 또는 sb_out/<이름>)'
        type: string
      kinds:
        description: '구울 판(board = 정식 시트 · conti = 스케치 동작 · both = 둘 다)'
        type: choice
        default: both
        options:
          - both
          - board
          - conti
      force:
        description: '이미 구운 게 있어도 다시 굽는다(1 = 다시 · 빈값 = 있으면 건너뜀)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: sb-sheet-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # 목록 = 이 잡이 실제로 여는 폴더뿐. ⚠ `apps/storyboard/샘플` 이 실효 조건 —
          #   판형 견본이 러너에 없으면 참조가 빈 채로 구워져 판형이 회차마다 흔들린다.
          sparse-checkout: |
            .github
            shared
            apps/storyboard
            viewer/sb_out
            sb_out
            messages

      - name: Bake sheets
        env:
          IN_ID: ${{ inputs.id }}
          IN_KINDS: ${{ inputs.kinds }}
          IN_FORCE: ${{ inputs.force }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # 1순위(스킬 규격) — 미등록이면 제미나이로 내려앉는다
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 2순위 폴백 · 260811 실측에서 이 층이 없어 시트가 0장이었다
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          REFGEN_PREFIX: sb_out
        run: |
          set -u
          DIR="viewer/sb_out/${IN_ID}"
          [ -s "$DIR/board.md" ] || DIR="sb_out/${IN_ID}"
          if [ ! -s "$DIR/board.md" ]; then
            echo "::error::콘티 글이 없다 — viewer/sb_out/${IN_ID}/board.md 도 sb_out/${IN_ID}/board.md 도 비었다"
            exit 1
          fi
          echo "콘티 폴더 = $DIR"
          echo "DIR=$DIR" >> "$GITHUB_ENV"
          if [ -s "$DIR/sheet.json" ] && [ "${IN_FORCE}" != "1" ]; then
            echo "이미 구운 시트가 있다 — 다시 굽지 않는다(값 0). 다시 구우려면 force=1"
            exit 0
          fi
          pip install --quiet requests pillow || { echo "::error::deps 설치 실패"; exit 1; }
          rc=0
          case "${IN_KINDS}" in
            board) K="board" ;;
            conti) K="conti" ;;
            *)     K="board conti" ;;
          esac
          for k in $K; do
            python3 .github/scripts/sb_sheet.py "$DIR/board.md" "$DIR" "$k" || rc=1
          done
          # sb_sheet 자신은 전면 fail-soft(rc 0)라 여기서 산출 실존으로 다시 판정한다 —
          # 「초록인데 그림이 없다」를 막는 자리(check_land_silence 축과 같은 취지).
          if [ ! -s "$DIR/sheet.json" ]; then
            echo "::error::시트 기록이 안 생겼다 — 그림 열쇠(OPENAI_API_KEY·GEMINI_API_KEY) 등록 여부를 확인해라"
            exit 1
          fi
          cat "$DIR/sheet.json"
          exit $rc

      - name: Commit output
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "nomute-bot"
          git config user.email "bot@nomute.local"
          git add "${DIR:-viewer/sb_out}" 2>/dev/null || true
          git add messages 2>/dev/null || true
          git commit -m "sb-sheet: ${{ inputs.id }} 콘티 시트" || { echo "커밋할 것 없음"; exit 0; }
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch --deepen=100 origin main 2>/dev/null || true
            if git fetch origin "$BRANCH" && git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true; sleep $((i*3))
          done
          [ "$pushed" = 1 ] || { echo "::error::push ${BRANCH} 5회 실패 — 출력 유실"; exit 1; }
