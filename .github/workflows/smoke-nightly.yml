# ═══════════════════════════════════════════════════════════════════════════════
# smoke-nightly.yml — 상비 UI 스모크 4종(smoke_all) 야간 무인 실행 (운영자 260717 Q07 "ㄱㄱ")
# 왜: 스모크는 세션이 손으로 돌릴 때만 살아있다 — 크론 자동커밋·타 세션이 흘린 드리프트가
#     다음 사람 실행 전까지 깜깜한 사각의 봉합. 매일 03:30 KST 1회 main에서 smoke_all을 돌리고
#     결과를 scraper/obs/smoke_last.json 관측 산출물로 커밋 → 30분 watchdog ⑥지표(check_smoke)가
#     rc≠0/정체를 읽어 웹푸시(발송 = 기존 watchdog 경로 재사용 = 중복 구현 0 · §📰-e).
# 불변: 뷰어·데이터 무접촉(관측 파일만 커밋) · LLM 0콜 · 과금 0 · 실패해도 다음 크론에 자연 재시도.
# 환경: ubuntu 러너 = google-chrome 내장(chromiumPath which 폴백) · playwright-core = 스모크가
#       tmp 캐시에 1회 자동 설치 · 워크플로 자체는 알림 안 쏨(알림 축 = watchdog 단일화).
# ═══════════════════════════════════════════════════════════════════════════════
name: smoke-nightly
on:
  schedule:
    - cron: '30 18 * * *'   # 18:30 UTC = 03:30 KST(§📐 KST 환산 명기 · 크론 소강 시간대)
  workflow_dispatch: {}      # 수동 실측(카나리아·환경 검증)용
concurrency:
  group: smoke-nightly
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 로컬 실측 ~13s · CI 콜드(playwright-core 설치) 수 분 — 하드킬 사각(⑤ 사고 교훈)은 watchdog 나이 감지가 커버
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: smoke_all 4종 실행 → 관측 산출물 기록
        run: |
          set +e
          bash shared/smoke_all.sh > smoke.log 2>&1; RC=$?
          echo "── smoke_all rc=$RC ── 로그 꼬리:"
          tail -30 smoke.log
          # 실패 사유 추출 = .github/scripts/smoke_obs.py 단일 정본(운영자 260807).
          #   ⚠ 구판은 여기서 `grep -E '^❌' smoke.log`로 뽑았는데 **스모크 24종 중 15종이 ❌를 안 쓰고**
          #     smoke_all 요약줄도 `──`로 시작해 매치 0 → 사유가 **구조적으로 빈 문자열**이었다(실측
          #     {"rc":1,"fail":""} · 260731~0807 8일 연속). watchdog ⑥이 그 빈 칸을 그대로 발화해
          #     「UI 스모크 FAIL(rc=1) —  」만 나갔고 운영자는 조치할 대상을 알 수 없었다.
          #     정본 파서는 종목별 rc·사유·플레이키를 구조화해 싣고 **빈 사유를 금지**한다(fail-closed).
          mkdir -p scraper/obs
          RC="$RC" python3 .github/scripts/smoke_obs.py smoke.log scraper/obs/smoke_last.json
          echo "RC=$RC" >> "$GITHUB_ENV"
      # ⚠⚠ 260817 봉합 — 구판은 `git commit` + `git pull --rebase --autostash origin main && git push`였고
      #   **착지가 한 번도 성공한 적이 없다**(실측: 계정 이관 후 2런 전건 미착지 · smoke_last.json의 유일 커밋은
      #   sns-trends가 우연히 주워 올린 1건). 실패 형태 = 런 31966816134 로그 원문:
      #     [main 89d690f] watchdog: smoke_last 관측 갱신 (bot) / 1 file changed
      #     error: cannot rebase: You have unstaged changes. → Applying autostash resulted in conflicts.
      #     ::warning::관측 커밋 푸시 실패 — 다음 크론에 재기록(fail-soft)
      #   원인 = 스모크 실행이 커밋 범위 **밖** tracked 파일을 남기고, 그 잔여가 리베이스를 사전 거부한다.
      #   ⚠ 이 병은 레포가 이미 알고 있었다 — news-analyze.yml 143행이 260714에 같은 실측("cannot pull with
      #     rebase: You have unstaged changes"로 4회 전패 → 분석물 유실)을 적고 stash 대피로 대처했는데
      #     **이 레인만 안 따라왔다**(= 「형제는 가진 걸 자기만 안 가졌다」 = check_seal_completeness 축).
      #   ⚠ 증상 0 = 스텝이 `|| echo`라 잡은 초록, 스모크는 실제로 28종 PASS, 화면도 정상 → 유일한 검출기가
      #     watchdog ⑥의 「정체 N시간」 경고였고 그 경고는 「스모크가 안 돌았다」로 읽혀 원인을 반대로 가리켰다.
      #   처방 = 정본 착지 헬퍼 위임(창작 0). git_land는 리베이스를 안 쓰고 {fetch → reset --hard origin/main →
      #     스냅샷 재적층 → commit → push}라 **잔여 변경이 착지를 막는 경로 자체가 없다**.
      #   ⚠ git_land 전제(인자 = 유일 기록자) 충족 — scraper/obs/smoke_last.json은 이 레인 단독 산출이다
      #     (같은 디렉터리의 obs 형제는 scrape 소유지만 **파일 단위** 스냅샷이라 무접촉).
      #   ⚠ 선행 `git commit` 금지 = check_land_precommit — 커밋하면 워킹트리 변동이 그 커밋에 흡수돼
      #     git_land가 「변동 없음」으로 조용히 빠진다(착지 0). 변동 유무 판정도 헬퍼 몫이다.
      - name: 관측 착지(git_land 위임 · 리베이스 잔여 거부 구조적 차단)
        run: |
          git config user.name "nomute-bot"
          git config user.email "bot@users.noreply.github.com"
          echo "── 커밋 범위 밖 잔여물(구판이 여기서 죽었다 · 관측용) ──"; git status --porcelain | head -20
          bash .github/scripts/git_land.sh "watchdog: smoke_last 관측 갱신 (bot)" scraper/obs/smoke_last.json
      - name: 결과 반영(FAIL = 런 붉게 · 알림은 watchdog ⑥이 담당)
        run: exit "$RC"
