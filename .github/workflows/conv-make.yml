name: conv-make

# 뷰어 변환 폼(Pages Function /api/conv)이 발사 — 단일 잡: 영상(URL/업로드) → ffmpeg{트림·비율 크롭·스케일·fps(60 보간/다운)}
#   → R2 conv_res/<id>/out.mp4 → viewer/conv_out/<id>/video.json 커밋(폼이 폴링). LLM 0콜 · 순수 ffmpeg. 골격 = track-make 미러.
on:
  workflow_dispatch:
    inputs:
      id:
        description: '작업 id(타임스탬프-hex6)'
        type: string
      url:
        description: '영상 URL(yt-dlp)'
        type: string
        default: ''
      file:
        description: '업로드 영상 파일 경로(uploads/<id>/src.*)'
        type: string
        default: ''
      up_branch:
        description: '업로드 일회용 브랜치(up-<id> · 빈값=main 커밋 경로) — ly/track 동일'
        type: string
        default: ''
      r2_src:
        description: 'R2 직업로드 키(up_src/<id>.<ext> · 대용량 ≤2GB — api/upload 발급 · 빈값=미사용 · 보관 24h 뒤 자동 청소[260810 — 구 「잡 끝 삭제」 폐지])'
        type: string
        default: ''
      opts:
        description: '변환 옵션 JSON {"fps":"keep|60i|30|24","ar":"orig|9:16|1:1|4:5|16:9","fit":"crop|pad(검정 여백·중앙)","pos":0..1(crop만),"t0":s,"t1":s,"res":"orig|1440|1080|720","q":"18|21|24(화질 CRF · 기본 18)","audio":"keep|norm(−14LUFS·L/R 통일)"}'
        type: string
        default: '{}'

concurrency:
  group: conv-make-${{ inputs.id }}
  cancel-in-progress: false

permissions:
  contents: write
  checks: read   # 배포 게이트(deploy-then-notify) — Pages 'Cloudflare Pages' 체크런 조회용(thumb/edit-make 정본 계승 · §완료알림 기틀)

jobs:
  conv:
    runs-on: ubuntu-latest
    timeout-minutes: 58   # 최악 스택{환경 ~10 + R2 소스 8 + 변환 33(보간 예산 25분 포함)} + 우아한 실패·커밋 창 — 무한 행만 차단(§9 · R2 선스텝 재산정 평의회6 260711)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1   # 최신 1커밋만 — 구 0은 원격 브랜치 567개 전체 히스토리를 받아 실측 105s를 먹었다(260810 · imggen run 30972520521 = 체크아웃 108s 중 워킹트리 쓰기는 3s뿐)
          # ⚡ 260810 sparse-checkout(scrape 카나리아 실증 = 같은 잡 A/B 20s→9s · 삭제 커밋 0건) — 목록 = 이 잡이 실행줄에서 여는 폴더뿐.
          #   빠지는 대형 = _versions 437M · docs 90M · 자료 75M · _산출 74M(어느 잡도 안 연다) · ⚠ git add/rm 대상은 전건 포함 검문 통과분.
          sparse-checkout: |
            .github
            push
            assets/brand
            shared
            apps
            uploads
            viewer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 변환 환경 (ffmpeg+yt-dlp)
        timeout-minutes: 10
        uses: ./.github/actions/runner-setup
        with:
          setup: apps/conv/setup.sh
          apt: ffmpeg

      - name: 소스 확보 (URL)
        if: ${{ inputs.url != '' }}
        timeout-minutes: 8   # yt-dlp 행 차단 — 전처리가 길어지면 FF_TIMEOUT 정직-에러 창(잡 캡 전 발화)이 줄어드는 결함 완화(평의회2)
        env:
          URL: ${{ inputs.url }}
          YT_COOKIES: ${{ secrets.YT_T_COOKIES }}   # 지금 쓰는 살아있는 칸 = 1순위(260811 · 죽은 칸을 먼저 두드리면 매 런 4번 헛시도 + 유튜브에 같은 주소로 실패를 반복해 보인다)
          YT_COOKIES_NAME: YT_T_COOKIES
          YT_COOKIES_2: ${{ secrets.YT_T2_COOKIES }}   # 예비 1 — 위가 죽으면 자동 회수
          YT_COOKIES_2_NAME: YT_T2_COOKIES
        run: |
          set -e
          COOKIES=""
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > /tmp/ck.txt; COOKIES="--cookies /tmp/ck.txt"; fi
          # 시도 사다리 = .github/scripts/ytdlp_try.sh(①쿠키+기본 ②쿠키+대체 ③무쿠키+기본 ④무쿠키+대체 · 260811)
          YTDLP_ERR=/tmp/yt_err.txt YTDLP_DIAG=/tmp/yt_diag.txt YTDLP_LABEL="영상 받기" bash .github/scripts/ytdlp_try.sh -f "bv*[height<=1920]+ba[ext=m4a]/bv*[height<=1920]+ba/b" --merge-output-format mp4 --no-playlist -o "/tmp/src.%(ext)s" "$URL" \
            || { { echo "영상 다운로드 실패 — 쿠키를 빼고도 다시 시도했는데 안 됐어. 파일 업로드로 해줘."; [ -s /tmp/yt_diag.txt ] && cat /tmp/yt_diag.txt || true; } > /tmp/conv_err.txt; echo "::error::yt-dlp 실패(4단 후): $URL"; exit 1; }
          SRC="$(ls /tmp/src.* 2>/dev/null | head -1 || true)"
          [ -n "$SRC" ] || { { echo "영상 다운로드 실패 — 파일 업로드로 해줘."; [ -s /tmp/yt_diag.txt ] && cat /tmp/yt_diag.txt || true; } > /tmp/conv_err.txt; echo "::error::다운 산출 없음"; exit 1; }
          echo "CONV_SRC=$SRC" >> "$GITHUB_ENV"

      - name: 소스 확보 (업로드 파일)
        if: ${{ inputs.file != '' }}
        env:
          FILE: ${{ inputs.file }}
          UP_BRANCH: ${{ inputs.up_branch }}
        run: |
          set -e
          if [ -n "$UP_BRANCH" ]; then
            case "$UP_BRANCH" in up-*) ;; *) echo "::error::up_branch는 up-* 만 허용: $UP_BRANCH"; exit 1;; esac
            git fetch origin "$UP_BRANCH" --depth=1 || { { echo "업로드 파일이 유실됐어 — 다시 올려줘."; [ -s /tmp/yt_diag.txt ] && cat /tmp/yt_diag.txt || true; } > /tmp/conv_err.txt; echo "::error::업로드 브랜치 fetch 실패: $UP_BRANCH"; exit 1; }
            EXT="${FILE##*.}"
            git show "FETCH_HEAD:$FILE" > "/tmp/upsrc.$EXT" || { { echo "업로드 파일 회수 실패 — 다시 올려줘."; [ -s /tmp/yt_diag.txt ] && cat /tmp/yt_diag.txt || true; } > /tmp/conv_err.txt; echo "::error::브랜치서 파일 회수 실패: $FILE"; exit 1; }
            FILE="/tmp/upsrc.$EXT"
          fi
          [ -f "$FILE" ] || { { echo "업로드 파일이 없어 — 다시 올려줘."; [ -s /tmp/yt_diag.txt ] && cat /tmp/yt_diag.txt || true; } > /tmp/conv_err.txt; echo "::error::업로드 파일 없음: $FILE"; exit 1; }
          echo "CONV_SRC=$FILE" >> "$GITHUB_ENV"

      - name: 소스 확보 (R2 직업로드 — 대용량 ≤2GB)
        if: ${{ inputs.r2_src != '' }}
        timeout-minutes: 8   # 2GB도 러너→R2 수십 MB/s면 수분 — 잡 캡 예산 압축(평의회6)
        env:
          R2_SRC: ${{ inputs.r2_src }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -e
          [ -z "${CONV_SRC:-}" ] || { echo "이미 소스 확보 — 스킵(다중 입력 방어)"; exit 0; }
          printf '%s' "$R2_SRC" | grep -Eqx 'up_src/[0-9]{12}-[a-f0-9]{6}\.(mp4|mov|m4v|webm|mkv|avi)' \
            || { echo "::error::잘못된 r2_src: $R2_SRC"; exit 1; }   # api 정규식과 동형 자체 재검증(개행·탭·확장자·문자셋 — 상류 신뢰 대신 최후 방어선 · 평의회1)
          [ -n "$R2_BUCKET" ] || { { echo "저장소(R2)가 설정 안 돼 있어 — 관리자 설정 후 다시."; [ -s /tmp/yt_diag.txt ] && cat /tmp/yt_diag.txt || true; } > /tmp/conv_err.txt; echo "::error::R2 시크릿 미설정"; exit 1; }
          EXT="${R2_SRC##*.}"
          export AWS_DEFAULT_REGION=auto AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          aws s3 cp "s3://$R2_BUCKET/$R2_SRC" "/tmp/upsrc.$EXT" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors \
            || { { echo "업로드 파일 회수 실패 — 다시 올려줘."; [ -s /tmp/yt_diag.txt ] && cat /tmp/yt_diag.txt || true; } > /tmp/conv_err.txt; echo "::error::R2 소스 회수 실패: $R2_SRC"; exit 1; }
          echo "CONV_SRC=/tmp/upsrc.$EXT" >> "$GITHUB_ENV"

      - name: 변환 (ffmpeg → R2 → video.json)
        timeout-minutes: 33   # 스텝 자체 캡 — 잡 58분 하드캔슬 전에 failure() error.log 표면화(track 문법)
        env:
          IN_ID: ${{ inputs.id }}
          CONV_OPTS: ${{ inputs.opts }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -e
          [ -n "$IN_ID" ] || { echo "::error::id 없음"; exit 1; }
          case "$IN_ID" in *[!0-9a-f-]*) echo "::error::잘못된 id"; exit 1;; esac
          [ -n "${CONV_SRC:-}" ] || { { echo "영상 입력이 없어 — URL이나 파일을 넣어줘."; [ -s /tmp/yt_diag.txt ] && cat /tmp/yt_diag.txt || true; } > /tmp/conv_err.txt; echo "::error::CONV_SRC 빈값"; exit 1; }
          python3 apps/conv/conv_run.py "$IN_ID" "$CONV_SRC"

      - name: 실패 기록(error.log) — 프론트가 폴링해 즉시 표시
        if: failure()
        env:
          IN_ID: ${{ inputs.id }}
        run: |
          [ -n "$IN_ID" ] || exit 0
          case "$IN_ID" in *[!0-9a-f-]*) exit 0;; esac
          mkdir -p "viewer/conv_out/${IN_ID}"
          if [ -s /tmp/conv_err.txt ]; then cp /tmp/conv_err.txt "viewer/conv_out/${IN_ID}/error.log";
          else echo "변환 실패 — Actions 로그를 확인해줘." > "viewer/conv_out/${IN_ID}/error.log"; fi
          echo "error.log: $(cat viewer/conv_out/${IN_ID}/error.log)"

      - name: Commit output
        if: always()
        env:
          IN_ID: ${{ inputs.id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          [ -n "$IN_ID" ] || { echo "id 없음 — 커밋 스킵"; exit 0; }
          case "$IN_ID" in *[!0-9a-f-]*) echo "잘못된 id — 커밋 스킵"; exit 0;; esac
          git config user.name "nomute-bot"
          git config user.email "bot@nomute.local"
          git rm -r "uploads/${IN_ID}" 2>/dev/null || true   # 업로드 원본 = R2/산출 후 불필요(git 비대화 방지 · ly 동일)
          git add "viewer/conv_out/${IN_ID}" 2>/dev/null || true
          git commit -m "conv: ${IN_ID} 변환 출력" || { echo "커밋할 것 없음"; exit 0; }
          pushed=0
          for i in 1 2 3 4 5; do
            git fetch --deepen=100 origin main 2>/dev/null || true   # 얕은 클론(fetch-depth:1) 짝 — 원격 새 커밋과 로컬 HEAD 사이가 끊겨 merge-base를 못 찾으면 아래 rebase가 통째로 실패한다(= 산출 유실). main 100커밋만이라 수 초 · 실패해도 무해(260810)
            if git fetch origin "$BRANCH" && git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then pushed=1; break; fi
            git rebase --abort 2>/dev/null || true; sleep $((i*3))
          done
          [ "$pushed" = 1 ] || { echo "::error::push ${BRANCH} 5회 실패 — 출력 유실"; exit 1; }

      # 배포 게이트(deploy-then-notify · §완료알림 기틀 · thumb/edit-make 정본 계승 · 운영자 260717 "나머지 도구도 같은 로직") —
      #   알림이 배포보다 먼저 도착해 '탭했는데 결과 미전파'가 되던 것 차단: 산출 커밋(video.json/error.log)이 포함된 Pages 빌드 완료 확인 후에만 푸시.
      #   신호 = 커밋의 'Cloudflare Pages' 체크런(이 레포는 Deployment 미생성·체크런만). 산출 커밋 또는 그걸 포함한 후속 커밋 success면 통과. 전 경로 exit 0 = 비치명.
      - name: 배포 게이트 (Pages 반영 확인)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          DEADLINE=$((SECONDS+480)); SEEN=0
          chk() {
            local out; out=$(gh api "repos/${{ github.repository }}/commits/$1/check-runs?per_page=50" \
              --jq '[.check_runs[] | select(.name=="Cloudflare Pages")][0] | (.status//"")+"/"+(.conclusion//"")' 2>/dev/null || echo '')
            [ -n "$out" ] && [ "$out" != "/" ] && SEEN=1
            [ "$out" = "completed/success" ]
          }
          while [ $SECONDS -lt $DEADLINE ]; do
            chk "$SHA" && { echo "배포 확인 — 산출 커밋 빌드 success (${SECONDS}s)"; exit 0; }
            git fetch -q origin main 2>/dev/null || true
            H=$(git rev-parse origin/main 2>/dev/null || echo '')
            if [ -n "$H" ] && [ "$H" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$H" 2>/dev/null; then
              chk "$H" && { echo "배포 확인 — 후속 커밋($H) 빌드에 포함 success (${SECONDS}s)"; exit 0; }
            fi
            [ $SECONDS -ge 180 ] && [ $SEEN -eq 0 ] && { echo "::warning::Cloudflare Pages 체크런 미관측 — 180s 폴백 통과(뷰어 재시도 사다리가 커버)"; exit 0; }
            sleep 15
          done
          echo "::warning::배포 success 8분 미확인 — 폴백 통과(뷰어 재시도 사다리가 커버)"

      # 변환 완료/실패 푸시 — 60i 보간(최대 25분) 등 긴 잡이라 창 닫아도 통지(편집기 완료 푸시와 동일 문법 · 운영자 260711).
      #   탭 = /conv.html(진행 pend가 24h 내 결과 자동 복원) · 잡별 tag · 비치명.
      - name: 변환 완료 푸시 (pywebpush)
        if: always()
        env:
          IN_ID: ${{ inputs.id }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          [ -n "$IN_ID" ] || exit 0
          case "$IN_ID" in *[!0-9a-f-]*) exit 0;; esac
          python3 -m pip install --quiet --break-system-packages pywebpush || { echo "::warning::pywebpush 미설치 — 푸시 생략"; exit 0; }
          VJ="viewer/conv_out/${IN_ID}/video.json"; EL="viewer/conv_out/${IN_ID}/error.log"
          OK=0; MSG=""
          if [ -s "$VJ" ]; then OK="$(python3 -c "import json;print(1 if json.load(open('$VJ')).get('url') else 0)" 2>/dev/null || echo 0)"; fi
          if [ "$OK" != "1" ] && [ -s "$EL" ]; then MSG="$(head -c 60 "$EL")"; fi
          if [ "$OK" = "1" ]; then BODY="변환 완료 — 탭해서 확인"; else BODY="변환 실패 — ${MSG:-로그 확인}"; fi
          python3 .github/scripts/push_send.py --notify "변환" "$BODY" --url "/conv.html?done=${IN_ID}" --tag "nomute-make-${IN_ID}" || echo "::warning::완료 푸시 실패(비치명)"

      - name: 업로드 브랜치 정리
        if: ${{ always() && inputs.up_branch != '' }}
        env:
          UP_BRANCH: ${{ inputs.up_branch }}
        run: |
          case "$UP_BRANCH" in up-*) ;; *) echo "up-* 아님 — 스킵"; exit 0;; esac
          git push origin --delete "$UP_BRANCH" || echo "브랜치 정리 실패(무해 — 수동 정리 대상): $UP_BRANCH"

      - name: 임시 업로드 청소 (R2 up_src · 나이 지난 것만)
        # (260810 운영자 "한번 올린거 바로 휘발시키지말고 냅둬봐") 종전 = 이 잡이 쓴 원본을 그 자리에서 `aws s3 rm` →
        #   러너는 원본을 **읽기만** 하는데도 같은 영상 두 번째 작업이 전체 재업로드였다(1GB면 1GB 다시).
        #   지금 = 남겨두고 **나이 든 것만** 청소(정본 = shared/r2_upsrc_gc.sh · TTL 기본 24h · 삭제 상한 200).
        #   만료 뒤 재발사는 api 쪽 head 검증이 "업로드 파일이 없어" 를 주고 뷰어가 자동 재업로드 = 종전 동작으로 폴백.
        if: ${{ always() }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          [ -f shared/r2_upsrc_gc.sh ] && bash shared/r2_upsrc_gc.sh || echo "청소기 없음(체크아웃 전 실패) — 스킵"