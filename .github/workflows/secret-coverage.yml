# 비밀칸·변수 등록 전수 점검 — 「코드가 쓰는 이름」이 저장소에 실제로 등록돼 있는가.
# 왜: 260816 계정 이관에서 인스타 접속 열쇠가 안 따라왔는데 그게 우연히 발견됐다(3시간마다 도는 레인이라
#     마침 그날 실패 메일이 왔다). 며칠에 한 번만 도는 레인의 열쇠가 빠졌다면 그때 가서야 터진다
#     = 비어 있는 칸은 터지기 전까지 화면 증상이 0이다. 이 레인이 그걸 매일 이름으로 드러낸다.
# 불변: 값 무출력(키 이름만) · 뷰어·데이터 무접촉(messages 만 커밋) · LLM 0콜 · 네트워크 0 · 과금 0.
# 정본 = .github/scripts/secret_coverage.py · 짝 게이트 = shared/check_refs.py check_secret_coverage_chain
# 롤백 = schedule 블록 제거(수동 전용) 또는 파일 삭제.
name: secret-coverage
on:
  schedule:
    - cron: '10 20 * * *'   # 20:10 UTC = 05:10 KST(크론 소강 시간대 · smoke-nightly 03:30 KST 다음 슬롯 = 경합 0)
  workflow_dispatch: {}
concurrency:
  group: secret-coverage
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # ⚠ toJSON(secrets) 를 넘기지만 스크립트는 **키 이름만** 뽑고 값은 즉시 버린다(원문 저장·출력 0).
      #   GitHub 도 로그에 나오는 시크릿 값을 마스킹한다 = 2중.
      #   이 방법 말고는 「등록된 이름 목록」을 얻을 길이 없다(개별 참조는 이름을 미리 알아야 한다 = 자기순환).
      - name: 등록분 대조(키 이름만 · 값 무출력)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: python3 .github/scripts/secret_coverage.py
      # 알림은 조기 반영 축이라 코얼레싱 접두를 붙이지 않는다(붙이면 다음 비스킵 빌드까지 최대 17분 늦게 뜬다).
      - name: 알림 착지
        if: ${{ always() }}
        run: |
          bash .github/scripts/git_land.sh "secret-coverage: 빈 칸 점검 알림 (bot)" messages || true
