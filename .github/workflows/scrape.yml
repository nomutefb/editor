name: scrape
# 한국 주요 뉴스 RSS 수집(knews_scraper) → ① viewer/candidates.json 갱신(수집함, 항상·과금0)
#                                        → ② analyze=true 일 때만 pending 적재 + news-analyze 발동(유료).
# 기본 = 수집만(큐레이션). 사람이 스크랩 탭에서 고름(픽=분석은 별도). cron 은 수집만 돌려 무인 토큰 0.
# 비용: 이 레포 public → Actions 무제한 무료. 자동분석(analyze=true)만 Opus 토큰 소비.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: '최근 N시간 기사만 수집'
        default: '24'
      min_cross:
        description: '교차등장 최소 매체 수(수집함·분석 공통 기본값 — to_candidates 는 CAND_MIN_CROSS 사용)'
        default: '2'
      top:
        description: '자동분석 시 적재 최대 기사 수(analyze=true 한정)'
        default: '20'
      categories:
        description: "수집 분야: all=전 분야(기본·260626 운영자 확대) / major=핵심5(전체·정치·경제·사회·국제) / 'politics,economy' 식 지정"
        default: 'all'
      analyze:
        description: 'true = 수집 후 top-N 자동분석까지(유료·Opus). 기본 false = 수집만.'
        default: 'false'
  schedule:
    # ⚠️ 실제 15분 구동 = 외부 cron-job.org가 이 워크플로의 workflow_dispatch API를 15분마다 호출(정본 타이머·신뢰성↑).
    #    아래 GitHub 네이티브 schedule은 보조 폴백뿐(GitHub cron은 지연·누락 잦음) — 중복 15분 트리거 방지로 2회/일만. 수집만(analyze 기본 false=토큰0).
    - cron: '0 21,9 * * *'   # 매일 06:00·18:00 KST (UTC 21:00·09:00)

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write   # candidates.json · pending/ · seen_urls.txt 커밋·push
  actions: write    # news-analyze 디스패치(analyze=true 한정)

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1   # 최신 1커밋만 — 구 0은 원격 브랜치 567개 전체 히스토리를 받아 실측 105s를 먹었다(260810 · imggen run 30972520521 = 체크아웃 108s 중 워킹트리 쓰기는 3s뿐)
          # ⚡ 260810 sparse-checkout(ly-make·edit-make·nb-make 정본 계승) — depth:1 뒤 남은 20s의 정체는 **워킹트리 블롭 회수**다.
          #   추적 파일 실측 = _versions 437M · uploads 100M · docs 90M · 자료 75M · _산출 74M · apps 47M · .claude 38M · cards 12M
          #   = 이 잡이 한 번도 안 여는 870M을 매 회차 받고 있었다. 남기는 것 = 이 워크플로가 실제로 읽고/쓰는 경로뿐.
          #   ⚠ viewer는 통째 유지(126M) = 쓰기 대상 viewer/candidates.json이 cone 모드에선 파일 단위 지정 불가 · 빠지면 add 실패 = 수집분 유실.
          #   ⚠ 삭제 커밋 사고 경로 없음 = 이 워크플로의 git add는 전건 **명시 경로**(add -A 없음 · 80·116·176행).
          sparse-checkout: |
            .github
            shared
            scraper
            push
            assets/brand
            pending
            messages
            viewer

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet feedparser requests

      - name: Collect (RSS → articles.json · top_urls.txt)
        run: |
          python3 scraper/knews_scraper.py \
            --categories "${{ inputs.categories || 'all' }}" \
            --out scraper/out \
            --hours "${{ inputs.hours || '24' }}" \
            --min-cross "${{ inputs.min_cross || '2' }}" \
            --top "${{ inputs.top || '20' }}"

      - name: Update 수집함 (candidates.json — 항상)
        run: python3 scraper/to_candidates.py scraper/out/articles.json

      - name: 관측 누적 (obs — 사건 cross/burst 궤적 영구 로그)
        run: |
          python3 scraper/snapshot.py || true   # 비치명: 실패해도 scrape 안 깸
          cp scraper/out/feed_health_obs.json scraper/obs/feed_health.json 2>/dev/null || true   # 피드 건강 원장 안정본(ts·n·fresh 제외 = 죽은/좀비 구성 변화시만 커밋 · daily_health가 읽음 · 260702)

      - name: Commit candidates.json + obs
        run: |
          if [ -z "$(git status --porcelain viewer/candidates.json scraper/obs)" ]; then
            echo "수집함·관측 변동 없음 — 커밋 생략"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ⚠⚠ 260817 봉합 — 선행 `git add`+`git commit` 제거(pick.yml 과 같은 병 · 그쪽 주석이 정본).
          #   먼저 커밋하면 git_land 가 「변동 없음」으로 빠져 수집분이 push 0 인 채 러너와 함께 증발한다
          #   (실측 run 31981457796 = 15분마다 전건 실패 = 수집함이 액션 축에선 통째로 안 올라가고 있었다).
          # ⚠⚠ 260816 봉합 — 구판 `pull --rebase -X ours` 는 리베이스에서 ours = **upstream** 이라 충돌 시
          #   우리 헝크가 버려지는데 push 는 성공한다. 실측 형태는 **부분 공동화**다(신규 파일은 살고
          #   append 원장의 dedup 줄만 빠진다) → 중복 재적재·재과금.
          #   → git_land 위임 = 리베이스를 안 쓰고(꼬임 0) **남의 착지분을 BASE 대조로 복원**한다(같은 날 봉합).
          #   원장 축의 유일 무손실이 이 방식이다(`-X theirs` 는 남의 줄을 지운다 = 샌드박스 실측).
          #   PAGES_COALESCE=0 = 이 축들은 코얼레싱 금지 축이라 접두를 끈다(pc_lane `_push` 문법 사본).
          git reset -q HEAD -- . 2>/dev/null || true
          PAGES_COALESCE=0 bash .github/scripts/git_land.sh "scrape: 수집함 candidates + 관측 obs 갱신" viewer/candidates.json scraper/obs
          git fetch -q origin main 2>/dev/null || true
          pushed=0; git merge-base --is-ancestor HEAD origin/main 2>/dev/null && pushed=1
          # ⚠⚠ 260817 2차 봉합 — 어제 착지 위임 개편(cf627f01 자리)이 판정의 조건 껍데기를 이 스텝만 빠뜨려
          #   **성공에도 무조건 exit 1**이었다(실측 run 31983645971 = 「git_land: 착지 성공(시도 1)」 직후
          #   「candidates push 실패」 → 뒤 스텝 화재 추적·속보 판정 디스패치·pending 적재가 매 런 통째 스킵).
          #   같은 커밋의 형제(:215 pending)와 pick.yml 은 조건 보유 = 이 자리만 알몸 판정이었다.
          [ "${pushed:-0}" = 1 ] || { echo "::error::candidates push 실패(재시도 소진) — 수집분이 main 에 안 올라갔다"; exit 1; }

      # ── ⑭-f 화재 재난문자 후속 추적(운영자 260803 "15분, 30분 뒤에 각각 검색해서 사상자가 있는지 확인 · 있다면 긴급보도 큐로") ──
      #   왜 여기인가 = 이 워크플로가 15분 정본 타이머(외부 cron-job.org)로 돌고, 바로 위에서 candidates.json(검색 대상)을
      #   갓 갱신했다 = 되짚기가 항상 '가장 신선한 수집함'을 본다. 새 워크플로·새 타이머 0.
      #   ⚠️ 자동 과금 경로(픽 1건 = Opus 1콜 + 썸네일$) — 가드는 scraper/fire_watch.py 안(중대재난 문턱·사건 dedup·
      #   3축 동시 히트·사건당 1픽 영구·일 상한 FIRE_DAY_CAP). 여기선 픽이 실제로 났을 때만 커밋+분석 발동.
      - name: 화재 후속 추적(+15·30분 사상자 확인)
        id: firewatch
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}          # 2순위 검색(미등록 = 빈값 → 수집함 1순위만 · 동작 불변)
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}      # 사상자 확인 즉시 웹푸시(watchdog.yml 동일 배선 · 없으면 push_send 가 '생략' rc=0)
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          set -o pipefail
          python3 scraper/fire_watch.py | tee /tmp/firewatch.out || echo "::warning::fire_watch 실패(스킵 — 다음 런 재평가)"
          echo "picked=$(sed -n 's/^PICKED=//p' /tmp/firewatch.out | tail -1)" >> "$GITHUB_OUTPUT"

      - name: 화재 추적 원장 커밋 & 분석 발동
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain push/fire_watch.json pending scraper/seen_urls.txt messages)" ]; then
            echo "화재 추적 변동 없음 — 커밋 생략"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add push/fire_watch.json pending scraper/seen_urls.txt messages   # messages = 사상자 확인 알림함 점등(msg.py 산출 · 빌드 입력이라 커밋돼야 뷰어에 뜬다)
          if git diff --cached --quiet; then echo "스테이지 변화 없음 — 커밋 생략"; exit 0; fi
          # ⚠⚠ 260817 봉합 — 선행 `git commit` 제거(pick.yml 과 같은 병 · 그쪽 주석이 정본).
          # ⚠⚠ 260816 봉합 — 구판은 `pull --rebase -X ours` 였다. 리베이스에서 ours = **upstream** 이라
          #   충돌 시 우리 헝크가 버려지는데 push 는 성공한다. 그래서 아래 주석이 선언한 「원장·pending·seen =
          #   한 커밋(원자)」이 **부분 공동화**로 깨진다(샌드박스 재현 = 신규 파일은 살고 dedup 줄만 빠진다).
          #   이 축에서 dedup 줄이 빠지면 같은 화재로 **중복 긴급알림·재과금**이 난다(알림은 커밋 전에 이미 발사).
          #   → git_land 위임 = 리베이스를 안 쓰고(꼬임 0) 남의 착지분을 BASE 대조로 복원한다(같은 날 봉합).
          #   PAGES_COALESCE=0 = scrape 는 코얼레싱 금지 축이라 접두를 끈다(pc_lane `_push` 문법 사본).
          git reset -q HEAD -- . 2>/dev/null || true
          PAGES_COALESCE=0 bash .github/scripts/git_land.sh \
            "fire-watch: 화재 후속 추적 원장 (큐잉 ${{ steps.firewatch.outputs.picked }}건)" \
            push/fire_watch.json pending scraper/seen_urls.txt messages
          # ⚠️ 원장·pending·seen = 한 커밋(원자) → 미착지면 news-analyze 가 pending 을 못 본다 = 발동 무의미(무과금 회피)
          git fetch -q origin main 2>/dev/null || true
          if ! git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
            echo "::error::화재 추적 커밋 미착지 — 분석 미발동(다음 런 재평가)"; exit 1; fi
          if [ "${{ steps.firewatch.outputs.picked }}" != "0" ] && [ -n "${{ steps.firewatch.outputs.picked }}" ]; then
            ok=0; for i in 1 2 3; do
              gh workflow run news-analyze.yml && { ok=1; break; }
              echo "::warning::news-analyze 디스패치 실패 — 재시도 $i"; sleep $((i*3))
            done
            [ "$ok" = 1 ] || { echo "::error::news-analyze 디스패치 3회 실패 — 큐 적재됐으나 분석 미발동(수동 실행 필요)"; exit 1; }
          fi

      # ── 속보 판정 디스패치 (새 속보후보 뜰 때만 — 토큰 절약, news-analyze 와 동일 패턴) ──
      # candidates.json 에 미판정 속보후보(breaking_candidate & 'breaking' 없음)가 있으면
      # breaking-judge 를 깨워 Claude 급발 판정 → breaking 확정. 없으면 디스패치 생략.
      - name: 속보후보 판정 디스패치
        env:
          GH_TOKEN: ${{ github.token }}
          TRANS_ON: '1'   # 외신 제목 번역 편승 계상(gate_judge --count 가 미번역 외신도 셈 · 승격 260703 — breaking-judge env TRANS_ON 롤백 시 이 줄도 짝 제거)
          GATE_REGRADE: ${{ vars.GATE_REGRADE || '1' }}   # 재채점 큐 계상 짝(260803 Q1304) — 판정측(breaking-judge)과 repo variable 1원천 · 한쪽만 끄면 유령 디스패치 루프
        run: |
          nb=$(python3 .github/scripts/breaking_judge.py --count 2>/dev/null || echo 0)
          ng=$(python3 .github/scripts/gate_judge.py --count 2>/dev/null || echo 0)
          gg=$(python3 .github/scripts/group_judge.py --count 2>/dev/null || echo 0)   # 사건 묶기 백로그(GROUP_ON 승격 260702 — breaking-judge env GROUP_ON 롤백 시 이 줄도 짝 제거)
          n=$(( ${nb:-0} + ${ng:-0} + ${gg:-0} ))
          if [ "${n}" -gt 0 ]; then
            echo "미판정 속보 ${nb}건 · 경중 ${ng}건 — breaking-judge(속보+경중) 디스패치"
            ok=0
            for i in 1 2 3; do                       # 단발 silent-fail 방지 — pending-sweep/pick.yml 3회 관용구 계승(260713 평의회6: 판정 레인 유일 기동 경로가 단발이던 최약체 봉합)
              if gh workflow run breaking-judge.yml; then ok=1; break; fi
              sleep $((i * 3))
            done
            [ "$ok" = 1 ] || echo "::warning::breaking-judge 디스패치 3회 실패(다음 scrape·pending-sweep 백스톱 재시도)"
          else
            echo "미판정 후보 없음 — 디스패치 생략"
          fi

      # ── 자동분석 (analyze=true 한정 — 유료) ──────────────────────────────
      - name: Emit to pending/ (중복 스킵)
        if: ${{ (inputs.analyze || 'false') == 'true' }}
        run: python3 scraper/to_pending.py | tee /tmp/emit.out

      - name: Commit & trigger analyze
        if: ${{ (inputs.analyze || 'false') == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain pending scraper/seen_urls.txt)" ]; then
            echo "신규 적재분 없음 — 커밋·분석발동 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending scraper/seen_urls.txt
          NEW="$(sed -n 's/^NEW=//p' /tmp/emit.out | tail -1)"
          # ⚠⚠ 260817 봉합 — 선행 `git commit` 제거(pick.yml 과 같은 병 · 그쪽 주석이 정본).
          # ⚠⚠ 260816 봉합 — 구판 `pull --rebase -X ours` 는 리베이스에서 ours = **upstream** 이라 충돌 시
          #   우리 헝크가 버려지는데 push 는 성공한다. 실측 형태는 **부분 공동화** = pending 신규 파일은 살고
          #   seen_urls 의 dedup 줄만 빠진다 → 같은 기사를 다시 집어 재적재·재과금.
          #   → git_land 위임 = 리베이스를 안 쓰고 남의 착지분을 BASE 대조로 복원한다(원장 축 유일 무손실).
          #   PAGES_COALESCE=0 = scrape 는 코얼레싱 금지 축이라 접두를 끈다.
          git reset -q HEAD -- . 2>/dev/null || true
          PAGES_COALESCE=0 bash .github/scripts/git_land.sh "scrape: pending ${NEW:-?}건 적재 (RSS 교차등장)" pending scraper/seen_urls.txt
          git fetch -q origin main 2>/dev/null || true
          pushed=0; git merge-base --is-ancestor HEAD origin/main 2>/dev/null && pushed=1
          # ⚠ 260816 봉합 — 같은 파일 형제 2곳(:102 candidates · 화재 추적)은 이미 판정을 갖는데 이 스텝만
          #   구판이라 소진 시 침묵이었다. 적재가 안 올라간 채 디스패치만 나가면 분석이 빈손으로 돈다.
          [ "${pushed:-0}" = 1 ] || { echo "::error::pending push 실패(재시도 소진) — 적재가 main 에 안 올라갔다"; exit 1; }
          # GITHUB_TOKEN 푸시는 news-analyze(push 트리거)를 재귀방지로 못 깨운다 → 명시 디스패치.
          ok=0; for i in 1 2 3; do
            gh workflow run news-analyze.yml && { ok=1; break; }
            echo "::warning::news-analyze 디스패치 실패 — 재시도 $i"; sleep $((i*3))
          done
          [ "$ok" = 1 ] || { echo "::error::news-analyze 디스패치 3회 실패 — pending 적재됐으나 분석 미발동(수동 실행 필요)"; exit 1; }
