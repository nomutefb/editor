name: moreimg

# 뷰어 '검색 이미지 +N장 더'(functions/api/moreimg.js 디스패치) + thumb_gen 7장 미달 자동 보충(ask/analyze
# 후속 스텝 디스패치 · 운영자 260726 "원래 7개") → Claude(Opus 5·effort max)가
# 기사 요약·시사점을 읽고 오버레이 뒤 후킹용 카드뉴스 배경에 효과적인 관련 뉴스이미지 소스를
# *기존과 중복없이* 더 찾아(WebSearch) og:image 추출(thumb_gen 재사용·R2) →
# cards/<stem>/thumbs/search.json 앞쪽 append. Cloudflare가 push마다 build-viewer 재실행 → 뷰어 반영.
# + 원문 url:"" 기사면 같은 콜에 원문 URL 찾기 임무를 얹어 queue/<stem>.md url 백필(운영자 260726
#   "봇차단 당해도 url까진 받을 수 있다 — 공유에 링크") → 뷰어 요약 헤더 원문(#src)·공유 활성.
# 카드 제미나이 0 불변(GEMINI env 부재). CSE 死 대체 — 위키미디어보다 관련도 높은 뉴스소스 직접 검색.
on:
  workflow_dispatch:
    inputs:
      stem:
        description: '기사 file 베이스(queue/<stem>.md · cards/<stem>)'
        required: true
        type: string
      want:
        description: '추가 장수(기본 5)'
        default: '5'
        type: string
      round:
        description: '보충 세대(1 = 첫 발사 · 상한 도달 시 자동 정지)'
        default: '1'
        type: string
      account:
        description: '구독 OAuth 계정'
        type: choice
        default: MUTENO
        options:
          - NOMUTEFB
          - MUTENO
          - EMS1130G

concurrency:
  group: moreimg-${{ github.event.inputs.stem }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  more:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1   # 최신 main 기준   # 구 0 = 원격 브랜치 567개 전량 수신 = 실측 105s(260810)
          # ⚡ 260810 sparse-checkout(scrape 카나리아 실증 = 같은 잡 A/B 20s→9s · 삭제 커밋 0건) — 목록 = 이 잡이 실행줄에서 여는 폴더뿐.
          #   빠지는 대형 = _versions 437M · docs 90M · 자료 75M · _산출 74M(어느 잡도 안 연다) · ⚠ git add/rm 대상은 전건 포함 검문 통과분.
          sparse-checkout: |
            .github
            shared
            cards
            queue
            metrics
            # ⚠⚠ 260817 봉합 — 평의회 260812 권고6이 착지 대상(:100 git add · :109 git_land)에 metrics 를 넣으며
            #   이 목록만 안 따라와, 계측 파일이 처음 실제로 생긴 260817 첫 발부터 「outside of your sparse-checkout」
            #   으로 add 가 죽고 같은 스텝의 cards(찾은 이미지)·queue(원문 백필)까지 통째 유실됐다(run 31984481542
            #   실측 · 3라운드 전건 = 웹검색 과금은 나가고 산출은 0). 형제(news-ask:62 등)는 전부 metrics 보유.

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code   # 러너엔 claude 미설치(없으면 exit 127)

      - name: Find more images
        env:
          # 인증 = 구독 OAuth(API 키 미사용) — analyze/ask와 동일 동적 계정 선택
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', github.event.inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO')] }}
          # 폴오버 4계정 체인(run_claude SSOT) — 운영자 260718 "전사 적용" · news-ask.yml 문법 그대로. 이 3줄이 없어서
          # 활성 계정 쿼터 시 moreimg만 전환 없이 즉사(rc=1 · 260726 Q581 실측 봉합).
          CLAUDE_CODE_OAUTH_TOKEN_ALT: ${{ (github.event.inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO') == 'NOMUTEFB' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_NOMUTEFB }}
          CLAUDE_CODE_OAUTH_TOKEN_ALT2: ${{ (github.event.inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO') == 'MUTENO' && secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G || secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENO }}
          CLAUDE_CODE_OAUTH_TOKEN_ALT3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130M }}
          ACTIVE_ACCOUNT: ${{ github.event.inputs.account || vars.ACTIVE_ACCOUNT || 'MUTENO' }}
          # R2 = 이미지 재호스팅(핫링크 0). 5개 다 없으면 외부 핫링크 폴백(thumb_gen 동작).
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MOREIMG_STEM: ${{ github.event.inputs.stem }}
          MOREIMG_WANT: ${{ github.event.inputs.want || '5' }}
          MOREIMG_ROUND: ${{ github.event.inputs.round || '1' }}
        run: |
          echo "활성 계정: ${ACTIVE_ACCOUNT} · stem=${MOREIMG_STEM} · want=${MOREIMG_WANT}"
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN_${ACTIVE_ACCOUNT} 시크릿 비어있음"; exit 1
          fi
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN GEMINI_API_KEY GDRIVE_SA_JSON
          pip install --quiet Pillow 2>/dev/null || pip3 install --quiet Pillow 2>/dev/null || echo "Pillow 설치 실패 — 로고필터 no-op(무회귀)"
          python3 .github/scripts/more_images.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "nomute-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in cards queue metrics; do if [ -e "$f" ]; then git add "$f"; fi; done   # 파일별 개별 add(Q980 전파: 결측 pathspec 1개 = add 전체 원자 abort 무음) · queue = 원문 URL 백필분(more_images.py · url:"" 기사 한정) · metrics = claude_meter shard 계측 착지(평의회 260812 권고6 — 구판 미커밋 = moreimg 원장 all-time 0건 실측 = Opus·웹검색 소비가 지도 밖)
          if git diff --cached --quiet; then
            echo "변경 없음(새 이미지 0 · URL 백필 0)"; exit 0
          fi
          # ⚠⚠ 260816 봉합 — 구판은 `pull --rebase -X ours` + push 4회였다. 리베이스에서 ours = **upstream**
          #   이라 충돌 시 우리 헝크가 버려지는데 push 는 성공한다(부분 공동화 = 신규 파일은 살고 queue·metrics
          #   원장 줄만 빠진다). → git_land 위임 = 리베이스를 안 쓰고 남의 착지분을 BASE 대조로 복원한다.
          #   PAGES_COALESCE=0 = 제작 산출은 코얼레싱 금지 축이라 접두를 끈다(pc_lane `_push` 문법 사본).
          git reset -q HEAD -- . 2>/dev/null || true
          PAGES_COALESCE=0 bash .github/scripts/git_land.sh "moreimg: 검색이미지 추가·원문URL 백필(Claude)" cards queue metrics
          git fetch -q origin main 2>/dev/null || true
          # ⚠ 이 축은 산출이 과금분이고 발사가 일회성이라 자동 재시도가 0 — 조용히 끝나면 보충 이미지가
          #   그대로 유실되고 화면은 「제작중」에 멈춘다(그림 자체는 R2 에 살지만 완료 신호·이력이 사라진다).
          git merge-base --is-ancestor HEAD origin/main 2>/dev/null || { echo "::error::moreimg 미착지 — 보충 이미지 결과 미착지"; exit 1; }
      # 아직 7장 미달이면 다음 라운드 자동 발사(운영자 260810 "해소 ㄱㄱ") — 수집 문턱(600)으로 후보 절반이
      # 화질에서 잘려 1회 보충으로는 자리가 안 찬다. 대상 = more_images.py 가 RUNNER_TEMP/moreimg_again.txt 에
      # 남긴 마커(정지 조건 3중 = 목표 달성·라운드 상한·새 소스 소진 → 스크립트가 안에서 판단해 마커를 안 쓴다).
      # 커밋·push *뒤* 발사 = 다음 런 체크아웃이 이번 search.json 을 본다(즉발이면 add/add 경합 = news-analyze 동일 교훈).
      - name: 미달 시 다음 라운드 발사
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          F="${RUNNER_TEMP:-/tmp}/moreimg_again.txt"
          [ -s "$F" ] || { echo "추가 라운드 없음"; exit 0; }
          [ -n "${GH_TOKEN}" ] || { echo "::warning::GH_TOKEN 없음 — 추가 라운드 생략(수동 '+N장 더' 폴백)"; exit 0; }
          sort -u "$F" | while read -r stem want rnd; do
            [ -n "$stem" ] || continue
            curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/moreimg.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"stem\":\"${stem}\",\"want\":\"${want}\",\"round\":\"${rnd}\"}}" \
              && echo "↻ ${stem} 라운드 ${rnd} 발사(want=${want})" || echo "::warning::${stem} 라운드 ${rnd} 발사 실패"
          done
